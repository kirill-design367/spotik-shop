# ПЕРВИЧНАЯ НАСТРОЙКА СЕРВЕРА. Запускается руками и рассчитана
# на ПОВТОРНЫЕ прогоны: каждый шаг проверяет, сделано ли уже, и
# ничего не ломает, если сделано. Гонять её можно сколько угодно —
# в частности, чтобы выпустить сертификат позже, когда разойдётся DNS.
#
# ⚠️ ПОРЯДОК ШАГОВ ЗАДАН ОДНИМ ОГРАНИЧЕНИЕМ: сертификата ещё нет,
# а nginx с `ssl_certificate` на несуществующий файл не стартует
# вовсе. Поэтому конфиг пишется В ДВА ЗАХОДА: сначала только http
# (сайт живой, плюс каталог для проверки Let's Encrypt), и только
# когда сертификат на диске — полный конфиг с https и редиректами.
# При повторном прогоне первый заход просто переписывает то же самое.
#
# ⚠️ СКРИПТ СНАЧАЛА КЛАДЁТСЯ ФАЙЛОМ, И ТОЛЬКО ПОТОМ ЗАПУСКАЕТСЯ.
# Соблазн отдать его в `ssh … 'bash -s' <<'EOF'` велик, но тогда
# скрипт и стандартный ввод — одно и то же: первая же команда,
# которая читает ввод (apt при неожиданном вопросе, snap, certbot),
# съедает остаток скрипта, и половина настройки молча не выполнится.
name: Первичная настройка сервера

on:
  workflow_dispatch:
    inputs:
      skip_cert:
        description: 'Не трогать сертификат (только nginx и файрвол)'
        type: boolean
        default: false
      # ⚠️ СПИСОК ПЕРВЫХ АДМИНИСТРАТОРОВ ИДЁТ ВХОДОМ, А НЕ КОНСТАНТОЙ
      # В ФАЙЛЕ. Репозиторий ПУБЛИЧНЫЙ, и почтовый адрес человека,
      # положенный в git, достаётся сборщикам спама навсегда. Пустое
      # значение — «не трогать то, что уже стоит на сервере»: повторный
      # прогон настройки список не стирает.
      admins:
        description: 'Первые администраторы: адреса через запятую (пусто — не менять)'
        type: string
        default: ''
      # ⚠️ БОЕВОЙ РЕЖИМ ПЕРЕКЛЮЧАЕТСЯ ОТСЮДА, А НЕ РУКОЙ НА СЕРВЕРЕ.
      # Одна эта величина меняет и флажок `IsTest`, и ПАРУ ПАРОЛЕЙ:
      # боевые пароли в тестовом режиме дают ошибку 29 («неверная
      # подпись»), неотличимую на глаз от ошибки в формуле. Умолчание —
      # «не менять»: прогон настройки, сделанный ради сертификата
      # или nginx, режим оплаты не трогает.
      robokassa_rezhim:
        description: 'Режим Робокассы'
        type: choice
        default: 'не менять'
        options:
          - 'не менять'
          - 'тест'
          - 'бой'
      # ⚠️ ТЕСТОВОЕ СООБЩЕНИЕ — ВХОДОМ, А НЕ КАЖДЫЙ ПРОГОН. Настройку
      # гоняют и ради сертификата, и ради nginx; сообщение на каждом
      # прогоне превратило бы служебный чат в свалку, и настоящее
      # уведомление об оплате потерялось бы среди проверок. Умолчание
      # поэтому «нет» — ровно как у режима Робокассы.
      telegram_proverka:
        description: 'Отправить в служебный чат тестовое уведомление'
        type: boolean
        default: false
      # ⚠️ АДРЕС ИДЁТ ВХОДОМ, А НЕ КОНСТАНТОЙ В ФАЙЛЕ — по той же
      # причине, что и список администраторов: репозиторий ПУБЛИЧНЫЙ,
      # и почта живого человека, положенная в git, достаётся сборщикам
      # спама навсегда (Р-92). И сам адрес здесь ВЫКЛЮЧАТЕЛЬ: пусто —
      # письма не шлём. Отдельный флажок был бы вторым источником
      # одного решения.
      pochta_komu:
        description: 'Послать на этот адрес код входа в админку (пусто — не слать)'
        type: string
        default: ''

concurrency:
  # Настройка и выкладка делят один сервер: одновременно им там делать
  # нечего. Группа общая с deploy.yml намеренно.
  group: server
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # ⚠️ ХОСТ, ПОЛЬЗОВАТЕЛЬ И КЛЮЧ УЕЗЖАЮТ В ~/.ssh/config, И ДАЛЬШЕ
      # ВЕЗДЕ ПРОСТО `ssh spotik`. Так короче, но взято это не ради
      # краткости: общий набор опций в переменной окружения не годится
      # вовсе — `~` в значении переменной НЕ раскрывается (тильду
      # подставляет разбор строки, а не подстановка), и `-i ~/.ssh/…`
      # молча ищет файл с именем «~».
      - name: Проверить секреты и настроить ssh
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          for n in HOST USER_NAME KEY; do
            [ -n "${!n}" ] || { echo "::error::не задан секрет $n"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null \
            || { echo "::error::SSH_KEY не разбирается как закрытый ключ"; exit 1; }
          {
            echo "Host spotik"
            echo "  HostName $HOST"
            echo "  User $USER_NAME"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 20"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh spotik 'echo подключение есть: $(hostname)'

      # DNS смотрим С РАННЕРА, а не с сервера: Let's Encrypt проверяет
      # домен снаружи, и важно то, что видит внешний мир.
      - name: Разошёлся ли DNS
        id: dns
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          ok=1
          for h in spotik.shop www.spotik.shop; do
            a=$(getent ahostsv4 "$h" | awk '{print $1}' | sort -u | paste -sd, -)
            if [ "$a" = "$HOST" ]; then echo "$h указывает на сервер"
            else echo "$h -> ${a:-НЕ РЕЗОЛВИТСЯ} (ждали адрес сервера)"; ok=0; fi
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = 1 ] || echo "::warning::DNS ещё не разошёлся — сайт поднимем по http, сертификат отложим"

      - name: Собрать скрипт настройки
        run: |
          mkdir -p /tmp/remote
          cat > /tmp/remote/setup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "══ пакеты ══"
          apt-get update -qq
          # Ubuntu 26.04: имена пакетов те же, что на 24.04, ставятся
          # так же. Единственное, чего может не оказаться в свежем
          # релизе, — certbot в universe; тогда берём из snap
          # и говорим об этом в логе.
          apt-get install -y -qq nginx rsync ufw unattended-upgrades ca-certificates openssl >/dev/null
          if command -v certbot >/dev/null 2>&1; then
            echo "certbot: уже стоит"
          elif apt-get install -y -qq certbot >/dev/null 2>&1; then
            echo "certbot: поставлен из apt"
          else
            echo "certbot: в apt не нашёлся, ставим из snap"
            apt-get install -y -qq snapd >/dev/null
            snap install core >/dev/null
            snap refresh core >/dev/null
            snap install --classic certbot >/dev/null
            ln -sf /snap/bin/certbot /usr/bin/certbot
          fi
          echo "  nginx:   $(nginx -v 2>&1)"
          echo "  certbot: $(certbot --version 2>&1)"

          echo "══ файрвол ══"
          # ⚠️ 22 РАЗРЕШАЕМ ПЕРВЫМ И ДО ВКЛЮЧЕНИЯ. Иначе ufw обрубит
          # текущую же сессию, и починить будет нечем.
          ufw allow 22/tcp   >/dev/null
          ufw allow 80/tcp   >/dev/null
          ufw allow 443/tcp  >/dev/null
          ufw default deny incoming  >/dev/null
          ufw default allow outgoing >/dev/null
          ufw --force enable >/dev/null
          ufw status verbose | sed 's/^/  /'

          echo "══ вход по паролю ══"
          # Постановка: вход по паролю НЕ отключать — заказчик заходит
          # им сам. Поэтому sshd не трогаем вовсе, только печатаем
          # текущее состояние, чтобы было видно: оно не менялось.
          sshd -T 2>/dev/null | grep -E '^(passwordauthentication|permitrootlogin)' | sed 's/^/  /' || true

          echo "══ автообновления безопасности ══"
          cat > /etc/apt/apt.conf.d/20auto-upgrades <<'CONF'
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          CONF
          systemctl enable --now unattended-upgrades >/dev/null 2>&1 || true
          echo "  unattended-upgrades: $(systemctl is-enabled unattended-upgrades 2>&1), $(systemctl is-active unattended-upgrades 2>&1)"

          echo "══ каталоги сайта ══"
          mkdir -p /srv/spotik/releases /var/www/certbot
          # Первая выкладка приедет позже; чтобы nginx поднялся уже
          # сейчас, кладём заглушку и целим на неё симлинк. Повторный
          # прогон её не тронет: симлинк уже существует.
          if [ ! -e /srv/spotik/current ]; then
            mkdir -p /srv/spotik/releases/placeholder
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>spotik.shop</title><p>Сервер настроен, выкладка ещё не приезжала.' \
              > /srv/spotik/releases/placeholder/index.html
            ln -sfn /srv/spotik/releases/placeholder /srv/spotik/current
          fi
          chmod 755 /srv /srv/spotik /var/www/certbot

          echo "══ PostgreSQL ══"
          apt-get install -y -qq postgresql postgresql-contrib >/dev/null
          systemctl enable --now postgresql >/dev/null 2>&1 || true
          echo "  $(psql --version 2>&1)"

          # ⚠️ ПАРОЛЬ БАЗЫ И КЛЮЧ ШИФРОВАНИЯ ГЕНЕРИРУЮТСЯ ЗДЕСЬ,
          # НА СЕРВЕРЕ, И В GIT НЕ ПОПАДАЮТ НИКОГДА — прямое
          # требование постановки. Файл окружения читает только root
          # и служба; при повторном прогоне уже созданные величины
          # НЕ перегенерируются: новый ключ шифрования означал бы,
          # что все сохранённые пароли перестали читаться.
          mkdir -p /srv/spotik
          touch /srv/spotik/env
          chmod 600 /srv/spotik/env
          chown root:root /srv/spotik/env

          zadat() { # zadat ИМЯ ЗНАЧЕНИЕ — только если имени ещё нет
            if ! grep -q "^$1=" /srv/spotik/env 2>/dev/null; then
              printf '%s=%s\n' "$1" "$2" >> /srv/spotik/env
              echo "  $1: создан"
            else
              echo "  $1: уже есть, не трогаем"
            fi
          }

          SNYATO=0
          snyat() { # snyat ИМЯ — убрать переменную, если она вдруг есть
            if grep -q "^$1=" /srv/spotik/env 2>/dev/null; then
              sed -i "/^$1=/d" /srv/spotik/env
              SNYATO=1
              echo "  $1: убран из окружения"
            else
              echo "  $1: и не было"
            fi
          }

          DBPASS="$(openssl rand -base64 30 | tr -d '\n/+=' | cut -c1-32)"
          if sudo -u postgres psql -tAc "select 1 from pg_roles where rolname='spotik'" | grep -q 1; then
            echo "  роль spotik: уже есть"
          else
            sudo -u postgres psql -qc "create role spotik login password '$DBPASS'" >/dev/null
            echo "  роль spotik: создана"
          fi
          if sudo -u postgres psql -tAc "select 1 from pg_database where datname='spotik'" | grep -q 1; then
            echo "  база spotik: уже есть"
          else
            sudo -u postgres createdb -O spotik spotik
            echo "  база spotik: создана"
          fi
          # Пароль пишем в окружение ТОЛЬКО если строки подключения
          # там ещё нет. Есть — значит база уже живёт с прежним
          # паролем, и менять его молча нельзя.
          if ! grep -q '^DATABASE_URL=' /srv/spotik/env; then
            printf 'DATABASE_URL=%s\n' "postgres://spotik:$DBPASS@127.0.0.1:5432/spotik" >> /srv/spotik/env
            echo "  DATABASE_URL: создан"
          else
            echo "  DATABASE_URL: уже есть, пароль не меняем"
          fi
          unset DBPASS

          zadat SPOTIK_CRYPTO_KEY "$(openssl rand -base64 32)"
          zadat SPOTIK_SITE_URL "https://spotik.shop"
          zadat NODE_ENV "production"
          zadat PORT "3000"
          zadat HOSTNAME "127.0.0.1"
          # Заготовки: заполняются руками, когда появятся ключи и ящик.
          zadat SPOTIK_ADMINS ""
          zadat ROBOKASSA_TEST "1"
          zadat ROBOKASSA_LOGIN ""
          zadat ROBOKASSA_PASS1 ""
          zadat ROBOKASSA_PASS2 ""
          zadat ROBOKASSA_TEST_PASS1 ""
          zadat ROBOKASSA_TEST_PASS2 ""
          zadat ROBOKASSA_ALGO "md5"
          zadat ROBOKASSA_SNO ""
          zadat SMTP_HOST ""
          zadat SMTP_PORT "587"
          zadat SMTP_USER ""
          zadat SMTP_PASS ""
          zadat SMTP_FROM "Spotik Shop <noreply@spotik.shop>"
          zadat TELEGRAM_BOT_TOKEN ""
          zadat TELEGRAM_CHAT_ID ""
          # ⚠️ ИМИТАТОРА ОПЛАТЫ НА БОЕВОМ СЕРВЕРЕ НЕТ НИ ПРИ КАКОМ
          # РАСКЛАДЕ. Он живёт только в проверках — в CI и на своей
          # машине, — и секрет ему задаёт сам сторож. Прежние прогоны
          # настройки его здесь СОЗДАВАЛИ, поэтому теперь он снимается,
          # и снимается на каждом прогоне: вернуть его может только
          # рука человека, и тогда следующая настройка уберёт снова.
          snyat SPOTIK_FAKE_PAY_SECRET

          # ⚠️ ПРИВЕЗЁННЫЕ ВЕЛИЧИНЫ ПЕРЕЗАПИСЫВАЮТ ПРЕЖНИЕ, и этим
          # они отличаются от `zadat`. Почта и список администраторов
          # обязаны меняться прогоном настройки: иначе смена пароля
          # ящика требовала бы руки на сервере. В фрагменте лежит
          # только то, что задано, — пустое значение сюда не попадает
          # вовсе, и стереть настроенную почту прогоном нельзя.
          #
          # ⚠️ ЗНАЧЕНИЕ НЕ РАЗБИРАЕТСЯ НИ ОДНОЙ ОБОЛОЧКОЙ. `read -r`
          # без разделителей отдаёт строку как есть, и она как есть
          # ложится в файл: пароль с пробелами, кавычками и решёткой
          # переживает переезд. Ровно на разборе такой строки
          # (`SMTP_FROM=Spotik Shop <no-reply@…>`) выкладка однажды
          # и упала — см. Р-85.
          if [ -f /tmp/spotik-extra.env ]; then
            echo "══ почта и администраторы ══"
            while IFS= read -r stroka; do
              case "$stroka" in ''|'#'*) continue;; *=*) ;; *) continue;; esac
              imya=${stroka%%=*}
              if [ "$stroka" = "$(grep -m1 "^$imya=" /srv/spotik/env 2>/dev/null)" ]; then
                echo "  $imya: не изменился"
                continue
              fi
              grep -v "^$imya=" /srv/spotik/env > /tmp/env.new 2>/dev/null || true
              printf '%s\n' "$stroka" >> /tmp/env.new
              cat /tmp/env.new > /srv/spotik/env
              rm -f /tmp/env.new
              SNYATO=1
              echo "  $imya: записан"
            done < /tmp/spotik-extra.env
            shred -u /tmp/spotik-extra.env 2>/dev/null || rm -f /tmp/spotik-extra.env
          fi

          echo "══ Node 22 ══"
          if command -v node >/dev/null 2>&1 && node -e 'process.exit(+process.versions.node.split(".")[0] >= 22 ? 0 : 1)'; then
            echo "  node: $(node -v) — годится"
          else
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1
            apt-get install -y -qq nodejs >/dev/null
            echo "  node: $(node -v) поставлен"
          fi

          echo "══ пользователь службы ══"
          id -u spotik >/dev/null 2>&1 || useradd --system --home /srv/spotik --shell /usr/sbin/nologin spotik
          chown -R spotik:spotik /srv/spotik/releases
          # Файл окружения остаётся у root: systemd читает его сам,
          # до запуска процесса, и службе он не виден.
          echo "  пользователь spotik: есть"

          echo "══ служба ══"
          # ⚠️ ПЕРЕЗАПУСК БЕЗ ПРОСТОЯ ДЕЛАЕТ НЕ systemd, А ПОРЯДОК
          # ВЫКЛАДКИ: новая папка приезжает целиком, симлинк
          # переключается одним rename(2), и только потом служба
          # перезапускается. Окно недоступности — это время старта
          # Next, около секунды; nginx в это время отдаёт 502,
          # поэтому выкладка ЖДЁТ, пока приложение ответит, и только
          # тогда считает себя успешной.
          cat > /etc/systemd/system/spotik.service <<'UNIT'
          [Unit]
          Description=Spotik Shop (Next.js)
          After=network.target postgresql.service
          Wants=postgresql.service

          [Service]
          Type=simple
          User=spotik
          Group=spotik
          WorkingDirectory=/srv/spotik/current
          EnvironmentFile=/srv/spotik/env
          ExecStart=/usr/bin/node /srv/spotik/current/server.js
          Restart=always
          RestartSec=2
          # Служба не должна видеть ничего, кроме своего каталога.
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectSystem=strict
          ProtectHome=yes
          ReadWritePaths=/srv/spotik
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable spotik >/dev/null 2>&1 || true
          echo "  spotik.service: $(systemctl is-enabled spotik 2>&1)"
          # Окружение читается ОДИН РАЗ, при старте процесса: пока
          # службу не перезапустить, снятая переменная живёт в её
          # памяти как ни в чём не бывало.
          if [ "$SNYATO" = 1 ] && systemctl is-active --quiet spotik; then
            systemctl restart spotik
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:3000/ && break
              sleep 1
            done
            echo "  spotik.service: перезапущен, окружение перечитано"
          fi

          echo "══ ежедневная резервная копия базы ══"
          mkdir -p /srv/spotik/backup
          chmod 700 /srv/spotik/backup
          cat > /usr/local/bin/spotik-backup.sh <<'BAK'
          #!/usr/bin/env bash
          # Копия базы с ротацией. Четырнадцать суток — это и история
          # на две недели, и меньше сотни мегабайт на диске.
          #
          # ⚠️ В КОПИИ ЛЕЖАТ ШИФРОТЕКСТЫ, А НЕ ПАРОЛИ. Ключ шифрования
          # живёт в /srv/spotik/env и в дамп не попадает: унесённая
          # копия доступов не открывает. Именно поэтому её можно
          # хранить рядом.
          set -euo pipefail
          umask 077
          dir=/srv/spotik/backup
          f="$dir/spotik-$(date +%Y%m%d-%H%M%S).sql.gz"
          sudo -u postgres pg_dump spotik | gzip -9 > "$f"
          find "$dir" -name 'spotik-*.sql.gz' -mtime +14 -delete
          echo "копия: $f ($(du -h "$f" | cut -f1))"
          BAK
          chmod 700 /usr/local/bin/spotik-backup.sh
          cat > /etc/systemd/system/spotik-backup.service <<'UNIT'
          [Unit]
          Description=Spotik Shop: dump the database

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/spotik-backup.sh
          UNIT
          cat > /etc/systemd/system/spotik-backup.timer <<'UNIT'
          [Unit]
          Description=Spotik Shop: daily database dump

          [Timer]
          OnCalendar=*-*-* 03:20:00
          Persistent=true

          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now spotik-backup.timer >/dev/null 2>&1 || true
          echo "  spotik-backup.timer: $(systemctl is-active spotik-backup.timer 2>&1)"

          echo "══ общие куски конфига ══"
          mkdir -p /etc/nginx/snippets/spotik-app

          # ⚠️ `add_header` В ЛОКАЦИИ ОТМЕНЯЕТ ВСЕ УНАСЛЕДОВАННЫЕ.
          # Поэтому общие заголовки лежат отдельным файлом и
          # подключаются В КАЖДОЙ локации, где есть свой add_header.
          # ⚠️ HSTS ЗДЕСЬ ТОЖЕ, И БЕЗ ЭТОГО ОН НЕ РАБОТАЛ БЫ.
          # `add_header` в локации отменяет ВСЕ унаследованные,
          # а локации у нас свои заголовки кэша ставят все до одной:
          # объявленный только в серверном блоке HSTS до ответа
          # не дошёл бы ни разу. По http заголовок безвреден —
          # браузер обязан его игнорировать вне защищённого
          # соединения.
          cat > /etc/nginx/snippets/spotik-headers.conf <<'CONF'
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header Strict-Transport-Security "max-age=86400" always;
          CONF

          # ⚠️ САЙТ ТЕПЕРЬ ПРИЛОЖЕНИЕ, А НЕ ПАПКА С ФАЙЛАМИ.
          # Двадцать седьмая итерация принесла кабинет, оформление,
          # оплату и админку: страницы собирает Next на этом же
          # сервере, а nginx стоит перед ним. С ДИСКА отдаётся только
          # то, у чего в имени есть хэш или что не меняется, —
          # остальное идёт в приложение.
          #
          # ОДИН файл на оба сценария, http и https, чтобы правила
          # не разъезжались между ними.
          cat > /etc/nginx/snippets/spotik-static.conf <<'CONF'
          server_tokens off;

          gzip on;
          gzip_vary on;
          gzip_comp_level 6;
          gzip_min_length 512;
          gzip_proxied any;
          gzip_types
            text/plain text/css text/javascript application/javascript
            application/json application/manifest+json image/svg+xml
            application/xml text/xml;
          # woff2 сжат внутри: повторное сжатие только греет процессор.

          client_max_body_size 1m;

          # ⚠️ ДОЛГИЙ КЭШ ТОЛЬКО ТАМ, ГДЕ ИМЯ ФАЙЛА СОДЕРЖИТ ХЭШ.
          # `^~` нужен, чтобы префикс победил регулярку ниже.
          location ^~ /_next/static/ {
            alias /srv/spotik/current/.next/static/;
            include snippets/spotik-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
          }

          # ⚠️ ШРИФТЫ НЕ IMMUTABLE: их имена БЕЗ хэша
          # (`inter-cyrillic.woff2`), и пересборка сабсета не меняет
          # адрес. Год кэша означал бы год со старым шрифтом.
          #
          # ⚠️ И ЛОВИМ ТОЛЬКО ФАЙЛЫ, А НЕ ВЕСЬ ПРЕФИКС. По адресу
          # `/fonts/` живёт СТРАНИЦА — служебная витрина для отбора
          # гарнитур (Р-65). Префиксная локация забрала бы и её:
          # nginx полез бы за каталогом на диск и ответил отказом
          # вместо страницы. Регулярка по расширению отдаёт с диска
          # сами файлы, а страницу оставляет приложению.
          location ~* ^/fonts/[^/]+\.woff2$ {
            root /srv/spotik/current/public;
            include snippets/spotik-headers.conf;
            add_header Cache-Control "public, max-age=2592000" always;
            access_log off;
          }

          # Метка сборки: по ней выкладка доказывает, что переключение
          # состоялось. Лежит файлом рядом с приложением.
          location = /_build.txt {
            alias /srv/spotik/current/_build.txt;
            include snippets/spotik-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
          }

          # Всё остальное ведёт приложение.
          #
          # ⚠️ `proxy_hide_header Cache-Control` ОБЯЗАТЕЛЕН. Без него
          # заголовок приходит ДВАЖДЫ: свой от Next и наш от
          # `add_header`, — и какой из них послушает браузер, решает
          # уже он. HTML на этом сайте не кэшируется долго нигде:
          # у лендинга правки цен обязаны доезжать сразу, а кабинет
          # и админка — это чужие персональные данные.
          location / {
            proxy_pass http://spotik_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_hide_header Cache-Control;
            include snippets/spotik-headers.conf;
            add_header Cache-Control "no-cache" always;
          }

          # Задел на будущее: свой .conf в этом каталоге добавляет
          # локацию, не трогая ничего из написанного выше. Пустую
          # маску nginx проглатывает без ошибки.
          include /etc/nginx/snippets/spotik-app/*.conf;
          CONF

          # `map` и `upstream` живут на верхнем уровне http, поэтому
          # лежат отдельным файлом в conf.d. Они тоже задел: пока
          # никто не проксирует, они ничего не делают.
          cat > /etc/nginx/conf.d/spotik-upstream.conf <<'CONF'
          map $http_upgrade $connection_upgrade { default upgrade; '' close; }
          upstream spotik_app { server 127.0.0.1:3000; keepalive 16; }
          CONF

          # ⚠️ GZIP И server_tokens ЖИВУТ В SERVER, А НЕ В conf.d.
          # Ubuntu 26.04 задаёт и `gzip on`, и `server_tokens` прямо
          # в своём /etc/nginx/nginx.conf, а conf.d подключается В ТОТ
          # ЖЕ контекст http — nginx падает на «directive is duplicate»
          # и не стартует вовсе. В контексте server те же директивы
          # просто перекрывают унаследованные. Файл из первого захода,
          # если он успел лечь, убираем.
          rm -f /etc/nginx/conf.d/spotik-gzip.conf

          echo "══ nginx по http ══"
          cat > /etc/nginx/sites-available/spotik <<'CONF'
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name spotik.shop www.spotik.shop;

            # Проверка Let's Encrypt обязана отвечать по http ВСЕГДА,
            # в том числе когда всё остальное уже уехало на https.
            location ^~ /.well-known/acme-challenge/ {
              root /var/www/certbot;
              default_type "text/plain";
            }

            include snippets/spotik-static.conf;
          }
          CONF
          ln -sfn /etc/nginx/sites-available/spotik /etc/nginx/sites-enabled/spotik
          rm -f /etc/nginx/sites-enabled/default

          nginx -t
          systemctl enable nginx >/dev/null 2>&1 || true
          systemctl reload nginx 2>/dev/null || systemctl restart nginx
          echo "  nginx поднят по http"
          SCRIPT

          cat > /tmp/remote/cert.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -d /etc/letsencrypt/live/spotik.shop ]; then
            echo "сертификат уже есть:"
            certbot certificates 2>/dev/null | sed 's/^/  /'
          else
            # webroot, а не --nginx: плагин переписывает конфиг сам,
            # а конфиг у нас свой и пересобирается этим же workflow
            # при каждом прогоне — правки плагина затёрлись бы.
            certbot certonly --webroot -w /var/www/certbot \
              -d spotik.shop -d www.spotik.shop \
              --non-interactive --agree-tos \
              -m lev.menashe@yandex.ru \
              --deploy-hook 'systemctl reload nginx'
          fi

          echo "══ автопродление ══"
          # Молчаливо не продлившийся сертификат — это упавший сайт
          # через три месяца, поэтому таймер проверяем явно, а не
          # «пакет же ставит».
          systemctl list-timers --all 2>/dev/null | grep -i certbot | sed 's/^/  /' \
            || echo "  ВНИМАНИЕ: таймера продления не видно"
          # Пробное продление НЕ обязано проходить, чтобы шаг считался
          # успешным: сертификат к этому моменту уже выпущен, а
          # черновой сервер Let's Encrypt имеет право отказать
          # по своим ограничениям. Роняя здесь workflow, мы бы
          # уронили его ПОСЛЕ успешной работы.
          certbot renew --dry-run 2>&1 | tail -6 | sed 's/^/  /' \
            || echo "::warning::пробное продление не прошло — посмотреть логи certbot"
          SCRIPT

          cat > /tmp/remote/https.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ ! -d /etc/letsencrypt/live/spotik.shop ]; then
            echo "::warning::сертификата нет, https-конфиг не ставим"
            exit 0
          fi

          # Параметры TLS одним файлом: обычно их кладёт certbot,
          # но при установке из snap файла может не быть, а конфиг
          # на него ссылается.
          if [ ! -f /etc/letsencrypt/options-ssl-nginx.conf ]; then
            cat > /etc/letsencrypt/options-ssl-nginx.conf <<'CONF'
          ssl_session_cache shared:le_nginx_SSL:10m;
          ssl_session_timeout 1440m;
          ssl_session_tickets off;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
          CONF
          fi

          cat > /etc/nginx/sites-available/spotik <<'CONF'
          # ── http: только проверка Let's Encrypt и редирект ──
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name spotik.shop www.spotik.shop;

            location ^~ /.well-known/acme-challenge/ {
              root /var/www/certbot;
              default_type "text/plain";
            }
            # Оба имени уходят СРАЗУ на канонический адрес: цепочка
            # http://www → https://www → https://apex была бы вторым
            # редиректом на ровном месте.
            location / { return 301 https://spotik.shop$request_uri; }
          }

          # ── https www: только редирект на без-www ──
          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            http2 on;
            server_name www.spotik.shop;

            ssl_certificate     /etc/letsencrypt/live/spotik.shop/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/spotik.shop/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;

            return 301 https://spotik.shop$request_uri;
          }

          # ── https: сам сайт ──
          server {
            listen 443 ssl default_server;
            listen [::]:443 ssl default_server;
            http2 on;
            server_name spotik.shop;

            ssl_certificate     /etc/letsencrypt/live/spotik.shop/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/spotik.shop/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;

            # ⚠️ HSTS НА СУТКИ, БЕЗ includeSubDomains И БЕЗ preload.
            # Срок короткий намеренно: заголовок необратим на своё
            # время — пока он не истёк, браузер отказывается открывать
            # сайт по http и не даёт обойти ошибку сертификата. Сутки
            # можно переждать, год — нет. Перед запуском в работу срок
            # поднимаем до года (открытый вопрос 64).
            #
            # Здесь он стоит ВТОРОЙ раз — первый в общем сниппете
            # заголовков, который подключается в каждую локацию.
            # Это не дублирование по небрежности: `add_header`
            # в локации отменяет ВСЕ унаследованные, а локации свои
            # заголовки кэша ставят все до одной. Серверный
            # `add_header` нужен для ответов, которые ни в одну
            # локацию не попали.
            add_header Strict-Transport-Security "max-age=86400" always;

            include snippets/spotik-static.conf;
          }
          CONF

          nginx -t
          systemctl reload nginx
          echo "nginx поднят по https"
          SCRIPT

          # Скрипты собраны локально и проверены на синтаксис ДО того,
          # как что-то трогать на сервере: половина настройки, упавшая
          # на опечатке, хуже настройки, не начатой вовсе.
          for f in /tmp/remote/*.sh; do bash -n "$f" && echo "синтаксис ок: $f"; done

      # ⚠️ ЗНАЧЕНИЯ ЕДУТ ФАЙЛОМ, А НЕ КОМАНДНОЙ СТРОКОЙ. Пароль
      # в `ssh spotik "SMTP_PASS=… bash …"` виден в `ps` на сервере
      # всё время работы скрипта, а в журнале раннера — маскируется
      # только буквальное совпадение с секретом. Фрагмент собирается
      # питоном из ОКРУЖЕНИЯ (ни одна оболочка его не разбирает),
      # уезжает по ssh потоком и на сервере имеет права 600.
      #
      # ⚠️ ПУСТОЙ СЕКРЕТ ЗНАЧИТ «НЕ ТРОГАТЬ», А НЕ «ОЧИСТИТЬ». Пока
      # ящика нет, письма идут в журнал сервера — это прямая
      # постановка; случайно затереть настроенную почту прогоном
      # настройки нельзя (Р-92). То же и с ключами Робокассы: пустой
      # секрет не стирает уже настроенный магазин.
      - name: Отвезти почту, администраторов, Робокассу и Телеграм
        env:
          ADMINS: ${{ inputs.admins }}
          RK_REZHIM: ${{ inputs.robokassa_rezhim }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          ROBOKASSA_LOGIN: ${{ secrets.ROBOKASSA_LOGIN }}
          ROBOKASSA_PASS1: ${{ secrets.ROBOKASSA_PASS1 }}
          ROBOKASSA_PASS2: ${{ secrets.ROBOKASSA_PASS2 }}
          ROBOKASSA_TEST_PASS1: ${{ secrets.ROBOKASSA_TEST_PASS1 }}
          ROBOKASSA_TEST_PASS2: ${{ secrets.ROBOKASSA_TEST_PASS2 }}
          ROBOKASSA_ALGO: ${{ secrets.ROBOKASSA_ALGO }}
          ROBOKASSA_ALGO_RESULT: ${{ secrets.ROBOKASSA_ALGO_RESULT }}
          ROBOKASSA_ALGO_SUCCESS: ${{ secrets.ROBOKASSA_ALGO_SUCCESS }}
          ROBOKASSA_SNO: ${{ secrets.ROBOKASSA_SNO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - > /tmp/remote/extra.env <<'PY'
          import os, sys

          # SMTP_SECURE обычно забывают, а у Яндекс 360 порт 465 —
          # это неявный TLS, и без признака отправка молча не идёт.
          # Выводим его из порта, если он не задан руками.
          port = os.environ.get('SMTP_PORT', '').strip()
          secure = os.environ.get('SMTP_SECURE', '').strip()
          if not secure and port:
              secure = '1' if port == '465' else '0'

          # ⚠️ АЛГОРИТМ ХЕША ПРОВЕРЯЕМ ЗДЕСЬ, А НЕ НА СЕРВЕРЕ.
          # Приложение неизвестное значение молча заменяет на md5
          # (иначе оплата упала бы на опечатке), и опечатка вылезла бы
          # ошибкой 29 — «неверная подпись», неотличимой от ошибки
          # в формуле. Пусть лучше прогон настройки честно упадёт.
          MOZHNO = ('md5', 'ripemd160', 'sha1', 'sha256', 'sha384', 'sha512')
          def algoritm(imya):
              v = os.environ.get(imya, '').strip().lower()
              if v and v not in MOZHNO:
                  sys.exit(f'{imya}={v}: такого алгоритма у Робокассы нет, годятся {", ".join(MOZHNO)}')
              return v

          # Режим: «не менять» не кладёт ничего, и прогон настройки,
          # сделанный ради сертификата, оплату не переключает.
          rezhim = os.environ.get('RK_REZHIM', '').strip()
          test = {'тест': '1', 'бой': '0'}.get(rezhim, '')

          pary = [
              ('SPOTIK_ADMINS', os.environ.get('ADMINS', '').strip()),
              ('SMTP_HOST', os.environ.get('SMTP_HOST', '').strip()),
              ('SMTP_PORT', port),
              ('SMTP_USER', os.environ.get('SMTP_USER', '').strip()),
              ('SMTP_PASS', os.environ.get('SMTP_PASS', '')),
              ('SMTP_FROM', os.environ.get('SMTP_FROM', '').strip()),
              ('SMTP_SECURE', secure),
              ('ROBOKASSA_LOGIN', os.environ.get('ROBOKASSA_LOGIN', '').strip()),
              ('ROBOKASSA_PASS1', os.environ.get('ROBOKASSA_PASS1', '')),
              ('ROBOKASSA_PASS2', os.environ.get('ROBOKASSA_PASS2', '')),
              ('ROBOKASSA_TEST_PASS1', os.environ.get('ROBOKASSA_TEST_PASS1', '')),
              ('ROBOKASSA_TEST_PASS2', os.environ.get('ROBOKASSA_TEST_PASS2', '')),
              ('ROBOKASSA_ALGO', algoritm('ROBOKASSA_ALGO')),
              ('ROBOKASSA_ALGO_RESULT', algoritm('ROBOKASSA_ALGO_RESULT')),
              ('ROBOKASSA_ALGO_SUCCESS', algoritm('ROBOKASSA_ALGO_SUCCESS')),
              ('ROBOKASSA_SNO', os.environ.get('ROBOKASSA_SNO', '').strip()),
              ('ROBOKASSA_TEST', test),
              ('TELEGRAM_BOT_TOKEN', os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()),
              ('TELEGRAM_CHAT_ID', os.environ.get('TELEGRAM_CHAT_ID', '').strip()),
          ]
          for imya, znachenie in pary:
              if znachenie:
                  print(f'{imya}={znachenie}')
          PY
          # В журнал уходят только ИМЕНА: значения здесь секреты.
          echo "в окружение сервера поедут: $(cut -d= -f1 /tmp/remote/extra.env | tr '\n' ' ')"
          ssh spotik 'umask 077; cat > /tmp/spotik-extra.env' < /tmp/remote/extra.env
          rm -f /tmp/remote/extra.env

      - name: Пакеты, файрвол, автообновления, nginx по http
        run: |
          ssh spotik 'cat > /tmp/spotik-setup.sh' < /tmp/remote/setup.sh
          ssh spotik 'bash /tmp/spotik-setup.sh; r=$?; rm -f /tmp/spotik-setup.sh; exit $r'

      - name: Выпустить сертификат
        if: ${{ steps.dns.outputs.ready == '1' && !inputs.skip_cert }}
        run: |
          ssh spotik 'cat > /tmp/spotik-cert.sh' < /tmp/remote/cert.sh
          ssh spotik 'bash /tmp/spotik-cert.sh; r=$?; rm -f /tmp/spotik-cert.sh; exit $r'

      # ⚠️ ЭТОТ ШАГ НЕ ЗАВИСИТ ОТ `skip_cert`, И ЭТО КУПЛЕНО ОТКАЗОМ.
      # Флажок значит «не трогать сертификат», а не «оставить сайт
      # без https»: первый заход привязал к нему и конфиг, прогон
      # с флажком переписал nginx на один только http, и живой сайт
      # перестал отвечать на 443. Конфиг ставится всегда, когда
      # сертификат есть на диске; сам скрипт это и проверяет.
      - name: nginx по https с редиректами
        if: ${{ steps.dns.outputs.ready == '1' }}
        run: |
          ssh spotik 'cat > /tmp/spotik-https.sh' < /tmp/remote/https.sh
          ssh spotik 'bash /tmp/spotik-https.sh; r=$?; rm -f /tmp/spotik-https.sh; exit $r'

      # ⚠️ ПРОВЕРЯЕМ ГОТОВОЕ СОСТОЯНИЕ, А НЕ СВОЙ ФАЙЛ ОКРУЖЕНИЯ.
      # `/srv/spotik/env` правим мы сами, и наша же ошибка в нём
      # спряталась бы от нашей же проверки (Р-47). Спрашиваем базу:
      # список сотрудников заполняет САМА СЛУЖБА при старте, значит
      # строка в таблице доказывает, что переменная доехала,
      # прочиталась и сработала. Плюс живой адрес входа с раннера.
      - name: Проверить администраторов
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://spotik.shop/admin/login/ || echo 000)
          [ "$code" = 200 ] || { echo "::error::страница входа в админку ответила $code"; exit 1; }
          echo "страница входа в админку: 200"
          spisok=$(ssh spotik "sudo -u postgres psql -tAc \"select email || ' ' || role || ' disabled=' || disabled from staff order by email\" spotik")
          if [ -z "$spisok" ]; then
            echo "::warning::в таблице сотрудников пусто — список SPOTIK_ADMINS не задавали ни разу"
          else
            echo "$spisok" | sed 's/^/  /'
          fi
          # Ни одного АКТИВНОГО администратора — в админку не войдёт никто.
          echo "$spisok" | grep -q 'admin disabled=f' \
            || echo "::warning::активных администраторов нет: задайте вход admins при запуске настройки"

      # ⚠️ СПРАШИВАЕМ ОКРУЖЕНИЕ ЖИВОЙ СЛУЖБЫ, А НЕ `/srv/spotik/env`.
      # Файл правим мы сами, и наша же ошибка в нём спряталась бы
      # от нашей же проверки (Р-47). В `/proc/<pid>/environ` лежит
      # то, что ДЕЙСТВИТЕЛЬНО прочитал systemd и с чем работает
      # процесс: строка там доказывает всю цепочку — секрет доехал,
      # файл прочитан, служба перезапущена.
      #
      # ⚠️ В ЖУРНАЛ УХОДЯТ ТОЛЬКО ИМЕНА И ФАКТ НАЛИЧИЯ. Значения —
      # пароли магазина и токен бота; печатать их нельзя ни при каком
      # раскладе. Исключение одно: `ROBOKASSA_TEST` — это режим,
      # а не секрет, и видеть его надо.
      - name: Проверить Робокассу, Телеграм и почту
        run: |
          set -euo pipefail
          # ⚠️ СКРИПТ КЛАДЁТСЯ ФАЙЛОМ, А НЕ УХОДИТ В `bash -s`: иначе
          # скрипт и стандартный ввод — одно и то же, и первая же
          # команда, читающая ввод, съедает остаток (Р-77).
          cat > /tmp/remote/check.sh <<'SCRIPT'
          #!/usr/bin/env bash
          pid=$(systemctl show -p MainPID --value spotik 2>/dev/null || echo 0)
          if [ "${pid:-0}" = 0 ]; then echo "служба spotik не запущена"; exit 0; fi
          okr() { tr '\0' '\n' < "/proc/$pid/environ"; }
          est()   { okr | grep -q "^$1=." && echo "задан" || echo "НЕ задан"; }
          znach() { okr | sed -n "s/^$1=//p" | head -1; }
          for n in ROBOKASSA_LOGIN ROBOKASSA_PASS1 ROBOKASSA_PASS2 ROBOKASSA_TEST_PASS1 ROBOKASSA_TEST_PASS2; do
            echo "$n: $(est "$n")"
          done
          echo "ROBOKASSA_TEST: $(znach ROBOKASSA_TEST) (1 — тестовый режим, 0 — боевой)"
          algo=$(znach ROBOKASSA_ALGO)
          echo "ROBOKASSA_ALGO: ${algo:-не задан, значит md5}"
          for n in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            echo "$n: $(est "$n")"
          done

          # ⚠️ ПЕЧАТАЕМ НЕ ЗНАЧЕНИЯ, А ВЫВОД. Значения SMTP_* — секреты
          # репозитория, и GitHub маскирует их в журнале раннера
          # звёздочками: диагностика, построенная на печати значений,
          # исчезла бы вместе с ними. Поэтому сравнение делается ЗДЕСЬ,
          # на сервере, а наружу идёт готовый приговор.
          for n in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM SMTP_SECURE; do
            echo "$n: $(est "$n")"
          done
          shost=$(znach SMTP_HOST); sport=$(znach SMTP_PORT)
          spolz=$(znach SMTP_USER); sot=$(znach SMTP_FROM); ssec=$(znach SMTP_SECURE)
          if [ -z "$shost" ]; then
            echo "почта: SMTP_HOST не задан — письма и коды входа идут в журнал сервера"
          else
            # Адрес из `Имя <адрес>`; если угловых скобок нет — строка целиком.
            sadres=$(printf '%s' "$sot" | sed -n 's/.*<\(.*\)>.*/\1/p')
            [ -n "$sadres" ] || sadres="$sot"
            niz() { printf '%s' "$1" | tr 'A-Z' 'a-z'; }
            if [ "$(niz "$sadres")" = "$(niz "$spolz")" ]; then
              echo "адрес в SMTP_FROM и SMTP_USER: совпадают"
            else
              echo "адрес в SMTP_FROM и SMTP_USER: РАСХОДЯТСЯ — Яндекс отвергнет письмо на шаге MAIL FROM"
            fi
            # ⚠️ ПРОБЕЛ В ПАРОЛЕ ПРИЛОЖЕНИЯ — САМАЯ ТИХАЯ ИЗ ПРИЧИН 535.
            # Яндекс показывает пароль приложения группами по четыре
            # знака, и скопированный вместе с пробелами он выглядит
            # правильным, а сервер отвечает «Invalid user or password».
            # Пробелов и переводов строки в нём не бывает никогда.
            #
            # ⚠️ И ПЕЧАТАЕТСЯ ЭТО ТОЛЬКО КОГДА НАШЛОСЬ. Журнал работ
            # ПУБЛИЧНОГО репозитория виден всем, а «в пароле N знаков»
            # или «пробела нет» — это биты самого пароля. Молчание
            # значит «чисто», и ни одного бита наружу не уходит.
            spar=$(znach SMTP_PASS)
            case "$spar" in
              *' '*|*"$(printf '\t')"*|*"$(printf '\r')"*)
                echo "SMTP_PASS: в значении есть ПРОБЕЛ, ТАБУЛЯЦИЯ ИЛИ ВОЗВРАТ КАРЕТКИ — у пароля приложения Яндекса их не бывает, это и даёт 535" ;;
            esac
            case "$spolz" in
              *@*) : ;;
              *)   echo "SMTP_USER: в значении нет знака @ — Яндексу нужен ПОЛНЫЙ адрес ящика, иначе 535" ;;
            esac
            # ⚠️ ПОРТ 465 У ЯНДЕКС 360 — ЭТО НЕЯВНЫЙ TLS. Без признака
            # `secure` nodemailer пойдёт открытым соединением, и разговор
            # оборвётся на приветствии (Р-92).
            case "$sport:$ssec" in
              465:1|465:true) echo "порт и TLS: 465 с неявным TLS — как надо у Яндекс 360" ;;
              465:*)          echo "порт и TLS: порт 465, а SMTP_SECURE=${ssec:-не задан} — БЕЗ неявного TLS отправка не пойдёт" ;;
              *)              echo "порт и TLS: порт ${sport:-не задан}, SMTP_SECURE=${ssec:-не задан}" ;;
            esac
            # Достижимость узла — ДИАГНОСТИКА, а не доказательство
            # отправки: доказывает её только настоящее письмо (Р-98).
            echo "адреса $shost: $(getent ahosts "$shost" | awk '{print $1}' | sort -u | paste -sd, - || echo 'НЕ РЕЗОЛВИТСЯ')"
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$shost/${sport:-465}" 2>/dev/null; then
              echo "порт $shost:${sport:-465} с сервера открыт"
            else
              echo "порт $shost:${sport:-465} с сервера НЕ ОТКРЫТ — письма не уйдут"
            fi
          fi

          # ⚠️ TELEGRAM ТОЛЬКО ПО IPv6. У российских серверов
          # api.telegram.org по IPv4 недоступен вовсе, и «счастливые
          # глаза» дали бы таймаут на каждой отправке. Здесь это
          # ПРОВЕРЯЕТСЯ С САМОГО СЕРВЕРА, а не предполагается.
          echo "AAAA api.telegram.org: $(getent ahostsv6 api.telegram.org | awk '{print $1}' | sort -u | paste -sd, - || echo 'НЕ РЕЗОЛВИТСЯ')"
          curl -6 -sS -o /dev/null --max-time 15 \
            -w 'telegram по IPv6: HTTP %{http_code} через %{remote_ip}\n' https://api.telegram.org/ \
            || echo "telegram по IPv6: НЕ ОТВЕТИЛ — уведомления работать не будут"
          curl -4 -sS -o /dev/null --max-time 8 \
            -w 'telegram по IPv4: HTTP %{http_code} через %{remote_ip}\n' https://api.telegram.org/ \
            || echo "telegram по IPv4: не отвечает — так и ожидается"

          # ⚠️ ТОКЕН НЕ УХОДИТ В КОМАНДНУЮ СТРОКУ: он лежит в адресе,
          # а командная строка видна в `ps` всё время работы запроса.
          # Поэтому адрес едет файлом с правами 600 и стирается сразу.
          tok=$(znach TELEGRAM_BOT_TOKEN)
          if [ -n "$tok" ]; then
            umask 077
            printf 'url = "https://api.telegram.org/bot%s/getMe"\n' "$tok" > /tmp/tg.conf
            otvet=$(curl -6 -sS --max-time 15 -w ' | HTTP %{http_code} через %{remote_ip}' -K /tmp/tg.conf 2>&1 || echo 'не ответил')
            rm -f /tmp/tg.conf
            case "$otvet" in
              *'"ok":true'*) echo "бот отвечает:${otvet##*|}" ;;
              *) echo "бот НЕ подтвердился:${otvet##*|}" ;;
            esac
          else
            echo "бот: токена нет — уведомления идут в журнал сервера"
          fi
          SCRIPT
          bash -n /tmp/remote/check.sh
          ssh spotik 'cat > /tmp/spotik-check.sh' < /tmp/remote/check.sh
          ssh spotik 'bash /tmp/spotik-check.sh; r=$?; rm -f /tmp/spotik-check.sh; exit $r' | sed 's/^/  /'

      # ⚠️ ТЕСТОВОЕ УВЕДОМЛЕНИЕ ИДЁТ ЧЕРЕЗ ОЧЕРЕДЬ ПРИЛОЖЕНИЯ,
      # А НЕ ЧЕРЕЗ `curl`. Curl доказал бы ровно одно: что с сервера
      # до Telegram достучаться можно. А знать надо другое — что
      # уведомление уходит ТЕМ САМЫМ кодом, который зовут оплата
      # и закрытие заказа, с его `family: 6`, его таймаутом и его
      # разбором ответа. Поэтому строка кладётся в `notify_outbox`,
      # разгребает её минутный будильник самой службы, а адрес,
      # по которому ушло, служба пишет в журнал сама. Тот же принцип,
      # что у имитатора оплаты: стучимся В ТУ ЖЕ ДВЕРЬ, иначе
      # проверяется не отправка, а обходной путь (Р-88).
      - name: Отправить тестовое уведомление в служебный чат
        if: ${{ inputs.telegram_proverka }}
        run: |
          set -euo pipefail
          cat > /tmp/remote/tg.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          pid=$(systemctl show -p MainPID --value spotik 2>/dev/null || echo 0)
          if [ "${pid:-0}" = 0 ]; then
            echo "служба spotik не запущена — отправлять нечем"
            exit 1
          fi
          okr() { tr '\0' '\n' < "/proc/$pid/environ"; }
          for n in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            okr | grep -q "^$n=." || { echo "$n у ЖИВОЙ службы не задан — окружение не доехало"; exit 1; }
          done

          # ⚠️ ТЕКСТ УЕЗЖАЕТ SQL-ПЕРЕМЕННОЙ psql, А НЕ СКЛЕЙКОЙ:
          # `:'imya'` psql закавычивает сам, и апостроф в тексте
          # не превращается в синтаксическую ошибку.
          #
          # ⚠️ И ЗАПРОС ИДЁТ ВВОДОМ, А НЕ ЧЕРЕЗ `-c`. Подстановку
          # переменных psql делает своим лексером, а строку из `-c`
          # он отдаёт серверу как есть: `:'t'` уезжает в Postgres
          # буквально и роняет запрос «syntax error at or near ":"».
          # Поймано прогоном на своей машине — на сервере это
          # выглядело бы как «проверка сломана», а сломан был бы вызов.
          metka="$(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          tekst="Spotik Shop: проверка связи, $metka.
          Это тестовое уведомление прогона настройки сервера — заказа за ним нет."
          nomer=$(sudo -u postgres psql -tAq -v t="$tekst" spotik <<'SQL'
          insert into notify_outbox (vid, tekst, popytok, sleduyushchaya_v)
          values ('proverka', :'t', 0, now()) returning id;
          SQL
          ) || exit 1
          [ -n "$nomer" ] || { echo "строка в очередь не встала"; exit 1; }
          echo "строка очереди № $nomer поставлена"

          # ⚠️ ЖДЁМ СОБЫТИЯ, А НЕ СЕКУНД. Будильник очереди ходит раз
          # в минуту ОТ СТАРТА ПРОЦЕССА, а службу мы только что
          # перезапустили: до первого тика может быть почти минута.
          # Фиксированная выдержка тут была бы гонкой — ровно той,
          # на которой мы уже горели дважды (Р-94, Р-97).
          srok=$(( $(date +%s) + 300 ))
          itog=1
          while :; do
            sost=$(sudo -u postgres psql -tAqF '|' \
              -c "select coalesce(to_char(sent_at,'HH24:MI:SS'),''), popytok,
                         coalesce(poslednyaya_oshibka,'')
                    from notify_outbox where id = $nomer" spotik)
            ushlo=${sost%%|*}
            hvost=${sost#*|}
            popytok=${hvost%%|*}
            oshibka=${hvost#*|}
            if [ -n "$ushlo" ]; then
              echo "УВЕДОМЛЕНИЕ УШЛО в $ushlo UTC, попыток: $popytok"
              itog=0
              break
            fi
            if [ "$(date +%s)" -ge "$srok" ]; then
              echo "УВЕДОМЛЕНИЕ НЕ УШЛО за пять минут: попыток $popytok, последняя ошибка: ${oshibka:-нет}"
              break
            fi
            sleep 5
          done

          # Адрес, по которому ушло, пишет САМА служба — это
          # наблюдение, а не наше предположение (закон 39).
          echo "── что записала служба ──"
          journalctl -u spotik --since '-15 min' --no-pager -o cat 2>/dev/null \
            | grep -E 'уведомлени|Telegram' | tail -8 || echo "(строк про уведомления в журнале нет)"
          exit $itog
          SCRIPT
          bash -n /tmp/remote/tg.sh
          ssh spotik 'cat > /tmp/spotik-tg.sh' < /tmp/remote/tg.sh
          ssh spotik 'bash /tmp/spotik-tg.sh; r=$?; rm -f /tmp/spotik-tg.sh; exit $r' | sed 's/^/  /'

      # ⚠️ КОД ВХОДА ШЛЁТСЯ НАСТОЯЩИМ ПУТЁМ, А НЕ ОТДЕЛЬНЫМ СКРИПТОМ.
      # `swaks` или python-smtplib доказали бы ровно одно: что с сервера
      # до Яндекса достучаться можно. А знать надо другое — что письмо
      # уходит ТЕМ САМЫМ кодом, который зовут вход в кабинет, выдача
      # доступов и сертификат: с его транспортом, его `secure`, его
      # `SMTP_FROM` и его разбором ответа. Поэтому мы С РАННЕРА нажимаем
      # «Выслать код» на ЖИВОЙ странице входа в админку — ровно то же,
      # что делает человек в браузере, — а дословный ответ почтового
      # сервера пишет в журнал САМА СЛУЖБА. Тот же принцип, что
      # у тестового уведомления в Telegram (Р-98) и у имитатора
      # оплаты (Р-88): стучимся В ТУ ЖЕ ДВЕРЬ, иначе проверяется
      # не отправка, а обходной путь.
      #
      # ⚠️ ФОРМА ОТПРАВЛЯЕТСЯ БЕЗ БРАУЗЕРА, И ЭТО НЕ ОБХОД. Серверное
      # действие Next работает и без JavaScript: в разметке формы лежат
      # скрытые поля `$ACTION_REF_N`, `$ACTION_N:0`, `$ACTION_N:1`
      # и `$ACTION_KEY`, и обычный multipart-POST с ними заводит ровно
      # то же действие, что и нажатие кнопки. Идентификаторы меняются
      # от сборки к сборке, поэтому они СНИМАЮТСЯ СО СТРАНИЦЫ каждый
      # прогон, а не зашиты числом; форма опознаётся ПО ПОЛЮ `email`,
      # а не по классу — класс могут переименовать.
      - name: Послать код входа настоящим путём
        if: ${{ inputs.pochta_komu != '' }}
        env:
          KOMU: ${{ inputs.pochta_komu }}
        run: |
          set -euo pipefail

          # В журнал раннера адрес идёт огрызком — ровно так же, как
          # его пишет сама служба (Р-87): проверяется не адрес,
          # а то, ушло ли по нему письмо.
          kratko=$(printf '%s' "$KOMU" | sed 's/^\(.\)[^@]*/\1…/')
          echo "кому: $kratko"

          # ⚠️ АДРЕС ЕДЕТ НА СЕРВЕР ПОТОКОМ, А НЕ АРГУМЕНТОМ: командная
          # строка видна в `ps` всё время работы скрипта — то же
          # правило, что у пароля ящика (Р-92). Файл ложится
          # с umask 077 и стирается сразу после проверки.
          printf '%s' "$KOMU" | ssh spotik 'umask 077; cat > /tmp/spotik-komu.txt'

          # ── ДО нажатия: метка журнала и предел таблицы ────────────
          #
          # ⚠️ МЕТКА БЕРЁТСЯ ЗАРАНЕЕ, И ЭТО НЕ ПЕДАНТИЗМ. Иначе пришлось
          # бы читать «последние строки журнала» и «последнюю строку
          # таблицы» — а они принадлежали бы прошлому входу, и проверка
          # доложила бы успех, ничего не проверив (Р-94). Курсор журнала
          # точнее часов: он не зависит от того, сходятся ли часы
          # раннера и сервера.
          cat > /tmp/remote/pochta-do.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          komu=$(cat /tmp/spotik-komu.txt)
          pid=$(systemctl show -p MainPID --value spotik 2>/dev/null || echo 0)
          if [ "${pid:-0}" = 0 ]; then echo "СЛУЖБА НЕ ЗАПУЩЕНА — слать нечем"; exit 1; fi
          if ! tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^SMTP_HOST=.'; then
            echo "SMTP_HOST у ЖИВОЙ службы не задан: письмо уйдёт в журнал, а не почтой"
          fi
          echo "METKA=$(date '+%F %T')"
          echo "KURSOR=$(journalctl -u spotik -n 0 --show-cursor --no-pager 2>/dev/null | sed -n 's/^-- cursor: //p')"
          sudo -u postgres psql -tAq -v e="$komu" spotik <<'SQL'
          select 'BYLO=' || coalesce(max(id), 0) from login_code where email = :'e' and scope = 'staff';
          select 'PROSHLO=' || coalesce(ceil(extract(epoch from (now() - max(created_at)))), 99999)::bigint
            from login_code where email = :'e' and scope = 'staff';
          select 'ZA_CHAS=' || count(*) from login_code
           where email = :'e' and scope = 'staff' and created_at > now() - interval '1 hour';
          SQL
          SCRIPT
          bash -n /tmp/remote/pochta-do.sh
          ssh spotik 'cat > /tmp/spotik-pochta-do.sh' < /tmp/remote/pochta-do.sh
          do_=$(ssh spotik 'bash /tmp/spotik-pochta-do.sh; r=$?; rm -f /tmp/spotik-pochta-do.sh; exit $r')
          printf '%s\n' "$do_" | grep -vE '^(METKA|KURSOR|BYLO|PROSHLO|ZA_CHAS)=' | sed 's/^/  /' || true
          METKA=$(printf '%s\n' "$do_"  | sed -n 's/^METKA=//p')
          KURSOR=$(printf '%s\n' "$do_" | sed -n 's/^KURSOR=//p')
          BYLO=$(printf '%s\n' "$do_"   | sed -n 's/^BYLO=//p')
          PROSHLO=$(printf '%s\n' "$do_" | sed -n 's/^PROSHLO=//p')
          ZA_CHAS=$(printf '%s\n' "$do_" | sed -n 's/^ZA_CHAS=//p')
          echo "  строк входа по этому адресу за час: ${ZA_CHAS:-?}, предел таблицы: ${BYLO:-?}"

          # ⚠️ ОГРАНИЧЕНИЕ ЧАСТОТЫ — ЭТО ПРАВИЛО ПРИЛОЖЕНИЯ, А НЕ ПОМЕХА.
          # Код выдаётся не чаще раза в минуту и не больше пяти за час;
          # второй прогон настройки подряд получил бы отказ, и проверка
          # выглядела бы как «почта сломана». Минуту просто ждём.
          if [ "${PROSHLO:-99999}" -lt 62 ]; then
            zhdat=$(( 63 - PROSHLO ))
            echo "  прошлый код просили ${PROSHLO} с назад — жду ${zhdat} с, чаще раза в минуту приложение не даёт"
            sleep "$zhdat"
          fi
          if [ "${ZA_CHAS:-0}" -ge 5 ]; then
            echo "::error::по этому адресу за час уже просили 5 кодов на вход В АДМИНКУ — приложение больше не выдаст. Счётчики у админки и кабинета РАЗНЫЕ: тем же адресом можно проверить через кабинет, либо подождать час"
            exit 1
          fi

          # ── Нажатие «Выслать код» на живой странице ───────────────
          cat > /tmp/remote/poslat.py <<'PY'
          # Снимаем форму с ЖИВОЙ страницы и отправляем её так, как это
          # сделал бы браузер с выключенным JavaScript.
          import html, os, re, sys, urllib.error, urllib.request, uuid

          # ⚠️ АДРЕС САЙТА — ПЕРЕМЕННАЯ РОВНО РАДИ РЕПЕТИЦИИ. На раннере
          # он всегда боевой; на своей машине тот же шаг гоняется
          # по локально поднятому серверу, иначе проверка проверялась
          # бы чтением кода, а не прогоном. Та же щель, что
          # `TELEGRAM_API_BASE` у отправки в чат (Р-97).
          BAZA = os.environ.get('SPOTIK_SAYT', 'https://spotik.shop')
          komu = os.environ['KOMU']

          def vzyat(url, telo=None, zagolovki=None):
              zapros = urllib.request.Request(url, data=telo, headers=zagolovki or {})
              try:
                  with urllib.request.urlopen(zapros, timeout=90) as o:
                      return o.status, o.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          kod, stranitsa = vzyat(f'{BAZA}/admin/login/')
          if kod != 200:
              sys.exit(f'страница входа в админку ответила {kod}')

          # Форму опознаём ПО ПОЛЮ email, а не по классу: на странице
          # есть и переключатель языка, и он тоже форма серверного
          # действия. Класс могут переименовать, поле — это смысл формы.
          formy = [f for f in re.findall(r'<form\b.*?</form>', stranitsa, re.S) if 'name="email"' in f]
          if len(formy) != 1:
              sys.exit(f'на странице входа {len(formy)} форм с полем email — разметка изменилась, проверку надо чинить')

          polya = []
          for m in re.finditer(r'<input[^>]*type="hidden"[^>]*>', formy[0]):
              tag = m.group(0)
              imya = re.search(r'name="([^"]*)"', tag)
              znach = re.search(r'value="([^"]*)"', tag)
              if imya:
                  polya.append((html.unescape(imya.group(1)), html.unescape(znach.group(1)) if znach else ''))
          if not any(n.startswith('$ACTION') for n, _ in polya):
              sys.exit('в форме нет полей $ACTION… — серверное действие без JavaScript не завести')
          polya.append(('email', komu))

          granitsa = '----spotik' + uuid.uuid4().hex
          kuski = []
          for imya, znach in polya:
              kuski.append(f'--{granitsa}\r\nContent-Disposition: form-data; name="{imya}"\r\n\r\n{znach}\r\n')
          telo = (''.join(kuski) + f'--{granitsa}--\r\n').encode('utf-8')

          # ⚠️ ORIGIN ОБЯЗАН СОВПАСТЬ С HOST. Next сверяет их у каждого
          # серверного действия и отбивает запрос при расхождении;
          # nginx передаёт приложению `Host $host`, то есть spotik.shop.
          kod, otvet = vzyat(f'{BAZA}/admin/login/', telo, {
              'Content-Type': f'multipart/form-data; boundary={granitsa}',
              'Origin': BAZA,
              'Accept': 'text/html,application/xhtml+xml',
              'User-Agent': 'spotik-setup/1.0',
          })
          print(f'страница входа ответила {kod} на отправку формы')
          oshibki = re.findall(r'<p class="err">(.*?)</p>', otvet, re.S)
          for o in oshibki:
              print('страница показала ошибку: ' + re.sub(r'<[^>]+>', '', o).strip())
          sys.exit(0 if kod == 200 else 1)
          PY
          python3 /tmp/remote/poslat.py | sed 's/^/  /'

          # ── ПОСЛЕ нажатия: новая строка и ответ почтового сервера ──
          #
          # ⚠️ ЖДЁМ СОБЫТИЯ, А НЕ СЕКУНД (Р-94, Р-97, Р-98). Событий два,
          # и оба однозначные: НОВАЯ строка в `login_code` (её пишет
          # `poprositKod` и только он) и строка журнала про письмо.
          # Строка «код входа выдан» ложится ПОСЛЕ отправки при любом
          # её исходе — она и есть признак того, что разговор с SMTP
          # закончен и ждать больше нечего.
          cat > /tmp/remote/pochta-posle.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          bylo="${1:-0}"; kursor="${2:-}"; metka="${3:-}"
          komu=$(cat /tmp/spotik-komu.txt)
          rm -f /tmp/spotik-komu.txt

          zhurnal() {
            if [ -n "$kursor" ]; then
              journalctl -u spotik --after-cursor "$kursor" --no-pager -o cat 2>/dev/null
            else
              journalctl -u spotik --since "$metka" --no-pager -o cat 2>/dev/null
            fi
          }

          srok=$(( $(date +%s) + 180 ))
          novaya=0
          while :; do
            novaya=$(sudo -u postgres psql -tAq -v e="$komu" -v b="$bylo" spotik <<'SQL'
          select coalesce(max(id), 0) from login_code
           where email = :'e' and scope = 'staff' and id > (:'b')::bigint;
          SQL
          )
            [ "${novaya:-0}" != 0 ] && break
            [ "$(date +%s)" -ge "$srok" ] && break
            sleep 2
          done
          if [ "${novaya:-0}" = 0 ]; then
            echo "КОД НЕ ВЫДАН: новой строки в login_code нет — приложение до отправки письма не дошло"
            zhurnal | tail -5
            exit 1
          fi
          echo "код входа выдан, строка login_code № $novaya"

          stroki=''
          while :; do
            stroki=$(zhurnal | grep -E 'письмо отправлено|письмо не ушло|ПИСЬМО \(SMTP не настроен' || true)
            [ -n "$stroki" ] && break
            [ "$(date +%s)" -ge "$srok" ] && break
            sleep 2
          done

          echo "── что записала служба ──"
          if [ -z "$stroki" ]; then
            echo "за три минуты служба ничего не записала про письмо — разговор с SMTP не закончился"
            exit 1
          fi
          printf '%s\n' "$stroki"

          # ⚠️ ПРИЧИНУ НАЗЫВАЕТ ШАГ РАЗГОВОРА, А НЕ ТЕКСТ ОШИБКИ.
          # `AUTH`, `MAIL FROM` и `RCPT TO` — три разные беды, и текст
          # у них похожий: «письмо не ушло». Шаг различает их точно.
          case "$stroki" in
            *'ПИСЬМО (SMTP не настроен'*)
              echo "ИТОГ: письма НЕ УХОДЯТ — SMTP не настроен, код лёг в журнал. Секреты SMTP_* не доехали до окружения службы"
              exit 1 ;;
            *'письмо не ушло'*)
              case "$stroki" in
                *'shag="AUTH'*)
                  echo "ИТОГ: Яндекс НЕ ПРИНЯЛ ЛОГИН И ПАРОЛЬ. Три причины дают один и тот же 535, и журнал их НЕ различает — различает только кабинет: (1) в SMTP_PASS не пароль приложения из id.yandex.ru, а пароль от аккаунта; (2) в SMTP_USER не полный адрес ящика; (3) в Яндекс 360 у ящика выключен доступ по протоколам" ;;
                *'shag="MAIL FROM"'*)
                  echo "ИТОГ: Яндекс ОТВЕРГ ОТПРАВИТЕЛЯ. Адрес в SMTP_FROM обязан совпадать с ящиком из SMTP_USER" ;;
                *'shag="RCPT TO"'*)
                  echo "ИТОГ: Яндекс ОТВЕРГ ПОЛУЧАТЕЛЯ — адрес не существует или почта туда не принимается" ;;
                *'vid="ESOCKET"'*|*'vid="EDNS"'*|*'vid="ETIMEDOUT"'*|*'vid="ECONNECTION"'*|*'vid="ETLS"'*|*'vid="EPROTOCOL"'*)
                  echo "ИТОГ: РАЗГОВОРА С ЯНДЕКСОМ НЕ ВЫШЛО — ответа нет вовсе, поэтому и кода ответа в строке нет. Самое вероятное: порт 465 без неявного TLS (SMTP_SECURE должен быть 1) — тогда соединение висит до срока и падает на шаге CONN. Дальше по списку: неверный SMTP_HOST, закрытый порт, нет DNS" ;;
                *)
                  echo "ИТОГ: ПИСЬМО НЕ УШЛО, дословный ответ сервера в строке выше" ;;
              esac
              exit 1 ;;
            *'письмо отправлено'*)
              echo "ИТОГ: ПИСЬМО УШЛО — ответ почтового сервера в строке выше (otvet=). Это НАБЛЮДЕНИЕ службы, а не наш вывод"
              exit 0 ;;
          esac
          exit 1
          SCRIPT
          bash -n /tmp/remote/pochta-posle.sh
          ssh spotik 'cat > /tmp/spotik-pochta-posle.sh' < /tmp/remote/pochta-posle.sh
          ssh spotik "bash /tmp/spotik-pochta-posle.sh '$BYLO' '$KURSOR' '$METKA'; r=\$?; rm -f /tmp/spotik-pochta-posle.sh /tmp/spotik-komu.txt; exit \$r" | sed 's/^/  /'

      - name: Проверить снаружи
        run: |
          # Проверяем С РАННЕРА и ПО ИМЕНИ, а не по адресу: нас
          # интересует ровно то, что увидит человек в браузере.
          echo "http://spotik.shop/ -> $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 http://spotik.shop/ || echo нет-ответа)"
          if curl -fsS -o /dev/null --max-time 20 https://spotik.shop/ 2>/dev/null; then
            curl -sSI --max-time 20 https://spotik.shop/     | head -1 | sed 's/^/  apex: /'
            curl -sSI --max-time 20 https://www.spotik.shop/ | grep -iE '^(HTTP|location)' | sed 's/^/  www:  /'
            curl -sSI --max-time 20 http://spotik.shop/      | grep -iE '^(HTTP|location)' | sed 's/^/  http: /'
            echo "::notice::сайт отвечает по https"
          else
            echo "::warning::https ещё не поднят — сайт живёт по http. Перезапустите этот workflow, когда разойдётся DNS"
          fi
