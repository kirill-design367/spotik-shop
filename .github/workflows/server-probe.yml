# Пробник доступа на сервер. Ничего не меняет и ничего не ставит —
# только отвечает на вопрос «заходит ли workflow по SSH и что там
# сейчас есть». Запускается руками, сколько угодно раз.
#
# Из среды разработки сервер недоступен (прокси закрывает всё, кроме
# github.com), поэтому единственное место, откуда его видно, — раннер
# GitHub. Отсюда и пробник отдельным файлом: он дешёвый и его не жаль
# гонять, пока настройка не сойдётся.
name: Пробник доступа на сервер

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить, что секреты вообще заданы
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          fail=0
          for n in HOST USER_NAME KEY; do
            v="${!n}"
            if [ -z "$v" ]; then echo "НЕТ СЕКРЕТА: $n"; fail=1
            else echo "секрет $n задан, длина ${#v}"; fi
          done
          [ "$fail" = 0 ] || { echo "::error::не заданы секреты репозитория"; exit 1; }

      - name: Что видит раннер про домен
        run: |
          # DNS смотрим ДО подключения: сертификат без него всё равно
          # не выпустить, и знать это лучше сразу.
          for h in spotik.shop www.spotik.shop; do
            a=$(getent ahostsv4 "$h" | awk '{print $1}' | sort -u | paste -sd, -)
            echo "$h -> ${a:-НЕ РЕЗОЛВИТСЯ}"
          done

      - name: Положить ключ
        env:
          KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Тип ключа печатаем без самого ключа: по нему видно, что
          # в секрет положили закрытую часть, а не открытую.
          head -1 ~/.ssh/id_deploy | sed 's/[A-Za-z0-9+/=]\{8,\}/…/g'
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null \
            && echo "ключ читается" \
            || { echo "::error::SSH_KEY не разбирается как закрытый ключ (парольная фраза? не тот формат?)"; exit 1; }
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          wc -l < ~/.ssh/known_hosts | xargs echo "строк в known_hosts:"

      - name: Зайти и осмотреться
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "$USER_NAME@$HOST" 'bash -se' <<'REMOTE'
          set -u
          echo "пользователь:      $(id -un) (uid $(id -u))"
          echo "хост:              $(hostname)"
          echo "система:           $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "ядро:              $(uname -r)"
          echo "архитектура:       $(uname -m)"
          echo "время на сервере:  $(date -u)"
          echo "место на диске:    $(df -h / | awk 'NR==2{print $4" свободно из "$2}')"
          echo "память:            $(free -m | awk 'NR==2{print $2" МБ"}')"
          echo
          echo "-- что уже стоит --"
          for p in nginx certbot ufw rsync curl; do
            if command -v "$p" >/dev/null 2>&1; then echo "$p: $($p --version 2>&1 | head -1)"
            else echo "$p: НЕТ"; fi
          done
          echo "unattended-upgrades: $(dpkg -s unattended-upgrades 2>/dev/null | awk -F': ' '/^Status/{print $2}' || echo НЕТ)"
          echo
          echo "-- сеть --"
          echo "внешний IPv4: $(ip -4 -o addr show scope global | awk '{print $4}' | paste -sd, -)"
          ss -lntp 2>/dev/null | awk 'NR==1 || /:(22|80|443) /' || true
          echo
          echo "-- права --"
          [ "$(id -u)" = 0 ] && echo "это root, sudo не нужен" || (sudo -n true 2>/dev/null && echo "sudo без пароля есть" || echo "ВНИМАНИЕ: не root и sudo без пароля НЕТ")
          echo
          echo "-- каталог сайта --"
          ls -la /srv/spotik 2>/dev/null || echo "/srv/spotik ещё нет — это нормально до первой настройки"
          REMOTE
          echo "::notice::SSH работает"

      # ⚠️ ДВЕРЬ RESULTURL ПРОБУЕТСЯ ЖИВЬЁМ, С НАСТОЯЩЕЙ ПОДПИСЬЮ.
      # Робокасса повторяет уведомление, пока не получит ровно
      # `OK<номер счёта>`; если формат ответа другой, она считает
      # оплату неподтверждённой. Прочитать это в коде мало — надо
      # увидеть ответ БОЕВОГО сервера.
      #
      # ⚠️ СЧЁТ БЕРЁТСЯ ЗАВЕДОМО НЕСУЩЕСТВУЮЩИЙ, и это главное
      # в пробе. Подпись сходится, обработчик отрабатывает целиком
      # и отвечает как Робокассе, а менять ему нечего: платежа
      # с таким номером нет. Ни один настоящий заказ проба
      # не трогает.
      - name: Дверь ResultURL живьём
        env:
          P2: ${{ secrets.ROBOKASSA_TEST_PASS2 }}
        run: |
          set -uo pipefail
          BASE=https://spotik.shop

          echo "-- адрес БЕЗ слеша: ровно это увидит Робокасса, если в кабинете нет слеша --"
          curl -sS -o /dev/null -D - --max-time 20 -X POST "$BASE/api/pay/result" \
            | sed -n '1p;/^[Ll]ocation:/Ip' | sed 's/\r$//;s/^/  /'

          if [ -z "${P2:-}" ]; then
            echo "ROBOKASSA_TEST_PASS2 не задан — подписанную пробу пропускаем"
            exit 0
          fi
          SUM=1.00; INV=999999
          # Подпись ResultURL: OutSum:InvId:Пароль№2, алгоритм md5
          # (умолчание кабинета и наше, см. Р-94). Пароль уходит
          # во ВВОД md5sum, а не в командную строку: она видна в ps.
          SIGN=$(printf '%s:%s:%s' "$SUM" "$INV" "$P2" | md5sum | cut -d' ' -f1)
          echo "-- адрес СО слешем, подпись настоящая, счёт заведомо несуществующий --"
          curl -sS -i --max-time 20 -X POST "$BASE/api/pay/result/" \
            --data-urlencode "OutSum=$SUM" \
            --data-urlencode "InvId=$INV" \
            --data-urlencode "SignatureValue=$SIGN" \
            | sed 's/\r$//' | sed -n '1p;$p' | sed 's/^/  /'
          echo "  (ждём: HTTP 200 и тело ровно OK$INV)"

      # Разбор одной беды: «оплата прошла, а уведомление не пришло».
      # Шаг НИЧЕГО не меняет — только читает базу и журнал службы.
      #
      # ⚠️ ПОЧТУ ЗАМАЗЫВАЕМ НА ВЫХОДЕ. Журнал работ ПУБЛИЧНОГО
      # репозитория виден всем, а в тексте уведомления «заказ
      # выполнен» стоит адрес сотрудника.
      - name: Разбор оплаты и уведомлений
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o BatchMode=yes \
              "$USER_NAME@$HOST" 'bash -se' <<'REMOTE' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/…@…/g'
          set -u
          pid=$(systemctl show -p MainPID --value spotik 2>/dev/null || echo 0)
          echo "-- служба --"
          echo "MainPID: ${pid:-0}"
          systemctl show -p ActiveEnterTimestamp --value spotik 2>/dev/null | sed 's/^/поднята: /'
          echo "процессов next-server: $(pgrep -fc 'next-server' 2>/dev/null || echo 0)"
          if [ "${pid:-0}" != 0 ]; then
            okr() { tr '\0' '\n' < "/proc/$pid/environ"; }
            # ⚠️ ЛОГИН, КОТОРЫМ ПРЕДСТАВЛЯЕМСЯ ЯНДЕКСУ, — ОГРЫЗКОМ,
            # НО ДОСТАТОЧНЫМ. Вопрос «тот ли ящик» решают три вещи:
            # первая буква, последняя и длина локальной части — их
            # хватает отличить `noreply` от `no-reply` (семь знаков
            # против восьми). Целиком печатать нельзя: GitHub заменил
            # бы секрет звёздочками, и строка стала бы бесполезной.
            spolz=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^SMTP_USER=//p' | head -1)
            case "$spolz" in
              *@*) lok=${spolz%%@*}
                   echo "SMTP_USER (он же логин AUTH): ${lok%"${lok#?}"}…${lok#"${lok%?}"}@${spolz#*@}, локальная часть ${#lok} знаков" ;;
              '')  echo "SMTP_USER: не задан" ;;
              *)   echo "SMTP_USER: без знака @ — Яндексу нужен ПОЛНЫЙ адрес ящика" ;;
            esac
            # Печатается ТОЛЬКО когда нашлось: «мусора нет» — это биты
            # самого пароля, а журнал работ публичного репозитория
            # виден всем.
            spar=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^SMTP_PASS=//p' | head -1)
            if [ -n "$spar" ] && [ -n "$(printf '%s' "$spar" | tr -d 'A-Za-z0-9')" ]; then
              echo "SMTP_PASS: есть знак, которого у пароля приложения Яндекса не бывает"
            fi
            for n in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_BASE TELEGRAM_IP_FAMILY ROBOKASSA_TEST SMTP_HOST; do
              v=$(okr | sed -n "s/^$n=//p" | head -1)
              case "$n" in
                TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|SMTP_HOST)
                  [ -n "$v" ] && echo "$n: задан" || echo "$n: НЕ задан" ;;
                *) echo "$n: ${v:-не задан}" ;;
              esac
            done
          fi

          echo
          echo "-- последние заказы --"
          sudo -u postgres psql -qAF '|' -P border=2 spotik <<'SQL'
          select id, kind, status, source, total_kop, money_kop, balance_kop,
                 to_char(created_at,'MM-DD HH24:MI:SS') as sozdan,
                 to_char(paid_at,'MM-DD HH24:MI:SS')    as oplachen,
                 to_char(closed_at,'MM-DD HH24:MI:SS')  as zakryt
            from shop_order order by id desc limit 10;
          SQL

          echo
          echo "-- последние платежи --"
          sudo -u postgres psql -qAF '|' -P border=2 spotik <<'SQL'
          select id, order_id, status, amount_kop,
                 to_char(created_at,'MM-DD HH24:MI:SS') as sozdan,
                 to_char(paid_at,'MM-DD HH24:MI:SS')    as oplachen
            from payment order by id desc limit 10;
          SQL

          echo
          echo "-- очередь уведомлений --"
          sudo -u postgres psql -qAF '|' -P border=2 spotik <<'SQL'
          select id, vid, popytok,
                 to_char(created_at,'MM-DD HH24:MI:SS')        as rozhdena,
                 to_char(sent_at,'MM-DD HH24:MI:SS')           as ushla,
                 to_char(sleduyushchaya_v,'MM-DD HH24:MI:SS')  as sleduyushchaya,
                 left(replace(tekst, E'\n', ' / '), 70)        as nachalo,
                 left(coalesce(poslednyaya_oshibka,''), 90)    as oshibka
            from notify_outbox order by id desc limit 20;
          SQL

          echo
          echo "-- что служба писала про оплату и уведомления (14 суток) --"
          sudo journalctl -u spotik --since '-14 days' --no-pager -o cat 2>/dev/null \
            | grep -E 'уведомление Робокассы|заказ создан|команде:|уведомление ушло|Telegram не ответил|отложенное уведомление|уведомление брошено|уведомление не легло|очередь уведомлений|оплачено меньше|заказ по сертификату|письмо не ушло|письмо отправлено' \
            | tail -60 || echo "(ни одной строки)"

          echo
          echo "-- что видел nginx на адресах оплаты --"
          # ⚠️ ЭТО РЕШАЮЩИЙ СЛЕД. Приложение пишет в журнал только то,
          # что до него ДОШЛО. Если Робокасса стучалась не туда или
          # не стучалась вовсе, в журнале службы не будет ничего —
          # и отличить «не пришло» от «пришло пустым» можно только
          # здесь, в записях nginx.
          #
          # ⚠️ АДРЕС КЛИЕНТА СРЕЗАЕМ: журнал работ публичного
          # репозитория виден всем, а в записи стоит IP плательщика.
          sudo grep -h -E '/(api/)?pay/' /var/log/nginx/access.log 2>/dev/null \
            | sed -E 's/^[0-9a-fA-F.:]+/…/' | tail -40 || echo "(ни одной записи)"
          echo "  счётчик по клиентам (наша проверка выкладки ходит curl'ом):"
          sudo cat /var/log/nginx/access.log 2>/dev/null \
            | grep -E '/api/pay/result' \
            | sed -E 's/.*" ([0-9]{3}) .*"([^"]*)"$/  ответ \1  клиент \2/' \
            | sort | uniq -c | sort -rn || echo "  (ни одной записи)"
          echo "  …и в прошлых файлах:"
          sudo zgrep -h -E '/(api/)?pay/' /var/log/nginx/access.log.*.gz /var/log/nginx/access.log.1 2>/dev/null \
            | sed -E 's/^[0-9a-fA-F.:]+/…/' | tail -20 || echo "  (ни одной записи)"

          echo
          echo "-- последние 40 строк журнала целиком --"
          sudo journalctl -u spotik --since '-14 days' --no-pager -o short-iso 2>/dev/null | tail -40 || true
          REMOTE
