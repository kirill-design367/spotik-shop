name: Публикация на GitHub Pages

on:
  push:
    # Ветка по умолчанию, как бы она ни называлась: репозиторий пока
    # живёт на рабочей ветке, main появится позже.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false, а не true: отменять уже идущую публикацию значит с заметной
  # вероятностью оставить Pages с наполовину выложенной выдачей
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ⚠️ ПОТОЛОК ВРЕМЕНИ. Без него job висит до шести часов, а логи
    # GitHub отдаёт только после завершения — то есть диагностики
    # не будет вовсе. Тридцать минут при обычных 25 хватает с запасом.
    #
    # Поставлен он после ЛОЖНОЙ ТРЕВОГИ, и её стоит записать: два
    # прогона были отменены как «зависшие», а на деле между опросами
    # проходили СЕКУНДЫ — фоновый `sleep` не ждёт. Прошедшее время
    # меряют по часам, а не по числу опросов. Потолок при этом
    # остаётся полезным сам по себе.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Сборка статического экспорта
        run: npm run build
        env:
          NODE_ENV: production

      # Без этого файла Pages отдаёт выдачу через Jekyll и выбрасывает
      # всё, что начинается с подчёркивания, — то есть весь каталог _next
      # с бандлами и шрифтами.
      - name: Положить .nojekyll
        run: touch out/.nojekyll

      - name: Проверить, что ассеты на месте
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/fonts/inter-cyrillic.woff2
          test -f out/fonts/index.html || test -f out/fonts.html
          test -d out/_next/static
          grep -q '/spotik-shop/_next/static' out/index.html
          grep -q "/spotik-shop/fonts/inter-cyrillic.woff2" out/index.html
          echo "выдача собрана, basePath проставлен"

      # Открывает собранную выдачу по боевому пути /spotik-shop/ в настоящем
      # браузере: 404 на ассетах, ошибки JS, незагруженные шрифты и
      # горизонтальный скролл ловятся только так. Проверка с корня такую
      # поломку не воспроизводит.
      - name: Открыть выдачу в браузере по боевому пути
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-export.mjs

      # Законы проекта про вордмарк: коэффициенты морфа в допуске ±1 %
      # и свес круглых литер не срезан. Оба проверяются по растру живой
      # страницы — регрессию в запечённых контурах иначе не поймать.
      - name: Проверить вордмарк по растру
        run: |
          node scripts/verify-morph.mjs
          node scripts/verify-clip.mjs
          node scripts/verify-enter.mjs
          node scripts/verify-follow.mjs
          node scripts/verify-footer.mjs
          node scripts/verify-footer-flow.mjs
          node scripts/verify-footer-band.mjs
          node scripts/verify-gutter.mjs
          node scripts/verify-coldstart.mjs
          node scripts/verify-scroller.mjs

      # Прокрутка и шапка: морф обязан идти БЕЗ отставания от прокрутки
      # на быстром движении, а шапка — быть светлой над тёмным и тёмной
      # над зелёным, с кромкой ровно там, где кромка зелёного.
      #
      # Инверсия осталась только у шапки: в середине страницы её нет
      # с девятнадцатой итерации (бегущая строка ушла на тёмный фон,
      # белая панель снята). verify-invert удалён вместе с приёмом.
      #
      # verify-qa и verify-route — сплошной перебор для двух приёмов
      # середины. Первый ловит и наложение половин, и ЩЕЛЬ между ними,
      # и положение, где открыто больше одного ответа; сравнивает он
      # границы В ПИКСЕЛЯХ, а не в процентах — в процентах дефект
      # двадцать второй итерации сходился до нуля (Р-67). Второй ловит
      # подсветку маршрута, идущую не туда, и заодно проверяет, что
      # линия выходит за оба края экрана. Оба обязаны падать и когда
      # не рисуется НИЧЕГО: выборочные положения и «зелёные замеры
      # на пустом месте» стоили трёх итераций (Р-47).
      #
      # verify-menu — временны́е условия постановки, которые на глаз
      # не проверяются вовсе: длительность поворота полос, stagger
      # пунктов и то, что накладка гаснет ПОЗЖЕ, чем крестик стал
      # бургером. И отдельной строкой — что скругление полос совпадает
      # с числом, по которому собирается фигура выворотки шапки.
      - name: Проверить прокрутку, шапку, движение и фокус
        run: |
          node scripts/verify-smooth.mjs
          node scripts/verify-navsweep.mjs
          node scripts/verify-motion.mjs
          node scripts/verify-qa.mjs
          node scripts/verify-cards.mjs
          node scripts/verify-route.mjs
          node scripts/verify-menu.mjs
          node scripts/verify-focus.mjs

      # Закон проекта: ни three.js, ни огибающей звука в сборке нет
      # вовсе. Сторож у этого закона один, и он должен стоять в CI,
      # а не в голове.
      - name: Проверить критический путь (ни three.js, ни огибающей звука)
        run: node scripts/check-bundle.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
