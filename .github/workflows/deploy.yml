# ВЫКЛАДКА НА СВОЙ СЕРВЕР, spotik.shop.
#
# ⚠️ ПУБЛИКАЦИИ НА GITHUB PAGES БОЛЬШЕ НЕТ. Сайт жил там подпапкой
# `/spotik-shop/`, отсюда были и `basePath`, и вся возня с префиксом.
# Двух мест публикации быть не должно: страницы отдавали бы старую
# версию по старому адресу, и он бы попадал в выдачу поисковиков.
#
# Порядок: собрать → прогнать всех сторожей → выложить в НОВУЮ папку →
# переключить симлинк → проверить живой сайт С РАННЕРА. Из среды
# разработки сервер не виден вовсе, поэтому единственная настоящая
# проверка боевого адреса — эта.
name: Выкладка на spotik.shop

on:
  push:
    # Ветка по умолчанию, как бы она ни называлась: репозиторий пока
    # живёт на рабочей ветке, main появится позже.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Группа общая с server-setup.yml: настройка и выкладка делят один
  # сервер, и одновременно им там делать нечего.
  group: server
  # false, а не true: отменить выкладку на полпути — значит с заметной
  # вероятностью оставить на сервере полуприехавшую папку. Она, правда,
  # ещё не подключена симлинком, но мусор копится.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ⚠️ ПОТОЛОК ВРЕМЕНИ. Без него job висит до шести часов, а логи
    # GitHub отдаёт только после завершения — то есть диагностики
    # не будет вовсе. Тридцать минут при обычных 15 хватает с запасом.
    #
    # Поставлен он после ЛОЖНОЙ ТРЕВОГИ, и её стоит записать: два
    # прогона были отменены как «зависшие», а на деле между опросами
    # проходили СЕКУНДЫ — фоновый `sleep` не ждёт. Прошедшее время
    # меряют по часам, а не по числу опросов.
    timeout-minutes: 40

    # ⚠️ БАЗА В CI — ЭТО НЕ РОСКОШЬ. Без неё сквозные проверки
    # магазина (заказ, оплата, выдача, сертификат) пропускались бы
    # молча, и первая настоящая проверка цепочки случалась бы
    # на живых деньгах.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: proverka
          POSTGRES_DB: spotik
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Сборка приложения
        run: npm run build
        env:
          NODE_ENV: production

      # ⚠️ РЕЛИЗ СОБИРАЕТСЯ ЗДЕСЬ, А НЕ НА СЕРВЕРЕ. `output: standalone`
      # даёт самодостаточный каталог с вшитыми зависимостями: на боевой
      # машине не нужен ни `npm ci`, ни сеть до npm. Две вещи Next
      # не кладёт туда сам, и это его задокументированное поведение:
      # `.next/static` и `public`.
      - name: Собрать релиз
        run: |
          rm -rf release
          cp -r .next/standalone release
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          cp -r public release/public
          # Миграции и их прогон едут вместе с кодом: схему накатывает
          # ТА ЖЕ версия, которая сейчас встанет.
          mkdir -p release/scripts
          cp -r db release/db
          # ⚠️ ТЕКСТ ОФЕРТЫ ЕДЕТ РЯДОМ. Страница статическая и читает
          # файл на сборке, но `standalone` трассирует только импорты,
          # а не `readFileSync` по вычисляемому пути: без этой строки
          # оферта на сервере была бы без текста.
          cp -r content release/content
          cp scripts/migrate.mjs release/scripts/migrate.mjs

          test -f release/server.js
          test -d release/.next/static
          test -f release/public/fonts/inter-cyrillic.woff2
          test -f release/db/migrations/001-osnova.sql
          # Лендинг обязан быть СТАТИЧЕСКИМ: если он вдруг стал
          # серверным, готовой разметки рядом со сборкой не будет,
          # и первый экран поехал бы считаться на каждый запрос.
          test -f release/.next/server/app/index.html
          # Класс поломки, поменявший знак вместе с переездом с GitHub
          # Pages: раньше ассет мог уйти МИМО префикса, теперь —
          # получить лишний. Ловим обе стороны.
          grep -q '"/_next/static' release/.next/server/app/index.html
          grep -q "url('/fonts/inter-cyrillic.woff2')" release/.next/server/app/index.html
          if grep -q '/spotik-shop/' release/.next/server/app/index.html; then
            echo "::error::в разметке остался префикс /spotik-shop/ — сайт живёт в корне домена"; exit 1
          fi
          echo "релиз собран: $(du -sh release | cut -f1)"

      # Открывает собранную выдачу в настоящем браузере: 404 на ассетах,
      # ошибки JS, незагруженные шрифты и горизонтальный скролл ловятся
      # только так.
      - name: Открыть сайт в браузере
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-export.mjs

      # Законы проекта про вордмарк: коэффициенты морфа в допуске ±1 %
      # и свес круглых литер не срезан. Оба проверяются по растру живой
      # страницы — регрессию в запечённых контурах иначе не поймать.
      - name: Проверить вордмарк по растру
        run: |
          node scripts/verify-morph.mjs
          node scripts/verify-clip.mjs
          node scripts/verify-enter.mjs
          node scripts/verify-follow.mjs
          node scripts/verify-footer.mjs
          node scripts/verify-footer-flow.mjs
          node scripts/verify-footer-band.mjs
          node scripts/verify-gutter.mjs
          node scripts/verify-coldstart.mjs
          node scripts/verify-scroller.mjs

      # Прокрутка и шапка: морф обязан идти БЕЗ отставания от прокрутки
      # на быстром движении, а шапка — быть светлой над тёмным и тёмной
      # над зелёным, с кромкой ровно там, где кромка зелёного.
      #
      # verify-qa и verify-route — сплошной перебор для двух приёмов
      # середины. Первый судит бегущую строку ответа: одна строка без
      # переносов, петля без шва по РАСТРУ, одновременно бежит ровно
      # одна. Второй ловит подсветку маршрута, идущую не туда, проверяет
      # все пять цифр растром и что линия доходит до пятой. Оба обязаны
      # падать и когда не рисуется НИЧЕГО: выборочные положения
      # и «зелёные замеры на пустом месте» стоили трёх итераций (Р-47).
      #
      # verify-cards — кромка карты сглажена, свет не задевает соседа,
      # доводка пружинная, дыхание живое.
      #
      # verify-gift — у сертификата нет своей цены (Р-93): карточка
      # показывает цену ПОДАРЕННОГО тарифа, под сеткой стоит выбор
      # тарифа вместо выбора аккаунта, «на троих» падает на месяц,
      # а в адрес оформления уезжает настоящий тариф с признаком
      # gift=1. Сравниваются две строки НА ЭКРАНЕ, а не пересчёт
      # `lib/plans.ts`: сторож не имеет права пользоваться моделью
      # предмета (Р-47).
      - name: Проверить прокрутку, шапку, движение и фокус
        run: |
          node scripts/verify-smooth.mjs
          node scripts/verify-navsweep.mjs
          node scripts/verify-motion.mjs
          node scripts/verify-qa.mjs
          node scripts/verify-cards.mjs
          node scripts/verify-route.mjs
          node scripts/verify-menu.mjs
          node scripts/verify-focus.mjs
          node scripts/verify-gift.mjs

      # ⚠️ МАГАЗИН ПРОВЕРЯЕТСЯ ЦЕЛИКОМ, А НЕ ПО ЧАСТЯМ. Заказ, оплата
      # и выдача — три разных места, и ошибка живёт в стыке между
      # ними. Оба сторожа поднимают настоящий сервер с настоящей
      # базой и ходят по нему браузером.
      #
      # verify-pay отдельно доказывает то, что нельзя проверить
      # на живой Робокассе, пока у магазина нет ключей: подпись
      # паролем №2 принимается, паролем №1 — нет, и возврат человека
      # на страницу успеха не подтверждает ничего.
      - name: "Проверить магазин: заказ, оплата, выдача, сертификат"
        env:
          DATABASE_URL: postgres://postgres:proverka@localhost:5433/spotik
        run: |
          node scripts/verify-shop.mjs
          node scripts/verify-pay.mjs

      # Закон проекта: ни three.js, ни огибающей звука в сборке нет
      # вовсе. Сторож у этого закона один, и он должен стоять в CI,
      # а не в голове.
      - name: Проверить критический путь (ни three.js, ни огибающей звука)
        run: node scripts/check-bundle.mjs

      # ⚠️ МЕТКА КЛАДЁТСЯ ПОСЛЕ СТОРОЖЕЙ. Она нужна проверке в самом
      # конце: без неё «сайт отвечает 200» ничего не доказывает —
      # двести отдала бы и прошлая версия, если переключение не
      # состоялось. Сторожа при этом лишнего файла в выдаче не видят.
      - name: Положить метку сборки
        run: |
          printf '%s\n' "$GITHUB_SHA" > release/_build.txt
          echo "метка: $GITHUB_SHA"

      # ⚠️ ХОСТ, ПОЛЬЗОВАТЕЛЬ И КЛЮЧ УЕЗЖАЮТ В ~/.ssh/config, И ДАЛЬШЕ
      # ВЕЗДЕ ПРОСТО `ssh spotik`. Общий набор опций в переменной
      # окружения не годится вовсе: `~` в значении переменной
      # НЕ раскрывается, и `-i ~/.ssh/…` ищет файл с именем «~».
      - name: Настроить ssh
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          for n in HOST USER_NAME KEY; do
            [ -n "${!n}" ] || { echo "::error::не задан секрет $n"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            echo "Host spotik"
            echo "  HostName $HOST"
            echo "  User $USER_NAME"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 20"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # ⚠️ ПРОВЕРЯЕМ ВСЁ ТРИ СРАЗУ И ДО ТОГО, КАК ЧТО-ТО ВЕЗТИ.
          # Сайт стал приложением: мало каталога — нужны служба
          # и файл окружения с паролем базы. Без них выкладка упала бы
          # на перезапуске, УЖЕ переключив симлинк, то есть оставила
          # бы сервер в худшем состоянии, чем застала.
          ssh spotik 'test -d /srv/spotik/releases && test -f /etc/systemd/system/spotik.service && test -s /srv/spotik/env' \
            || { echo "::error::сервер не настроен под приложение (нет каталога, службы spotik.service или /srv/spotik/env) — прогоните «Первичная настройка сервера»"; exit 1; }

      # Выкладка БЕЗ ПРОСТОЯ: папка приезжает целиком и только потом
      # подключается. Номер прогона в имени, а не только хэш: повторный
      # прогон того же коммита обязан поехать в СВОЮ папку, иначе
      # rsync правил бы каталог, на который смотрит живой сайт.
      - name: Выложить в новую папку
        id: put
        run: |
          REL="$(echo "$GITHUB_SHA" | cut -c1-12)-${GITHUB_RUN_NUMBER}"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          ssh spotik "mkdir -p /srv/spotik/releases/$REL"
          rsync -a --delete --chmod=D755,F644 -e ssh release/ "spotik:/srv/spotik/releases/$REL/"
          ssh spotik "test -f /srv/spotik/releases/$REL/server.js && test -d /srv/spotik/releases/$REL/.next/static" \
            || { echo "::error::папка приехала неполной"; exit 1; }
          echo "приехало в /srv/spotik/releases/$REL"

      # ⚠️ МИГРАЦИИ ИДУТ ДО ПЕРЕКЛЮЧЕНИЯ СИМЛИНКА. Новая версия кода
      # не должна встретить старую схему. Прогон идемпотентен:
      # применённое второй раз не применяется.
      - name: Накатить миграции
        env:
          REL: ${{ steps.put.outputs.rel }}
        run: |
          ssh spotik "REL='$REL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "/srv/spotik/releases/$REL"
          # ⚠️ ФАЙЛ ОКРУЖЕНИЯ НЕЛЬЗЯ ЗАГРУЖАТЬ ЧЕРЕЗ `.` — ЭТО НЕ
          # СКРИПТ. Его читает systemd, и значения там лежат как есть,
          # без кавычек: строка `SMTP_FROM=Spotik Shop <no-reply@…>`
          # для bash это команда `Shop` с перенаправлением ввода,
          # и весь шаг падает на ровном месте. Миграциям нужна ровно
          # одна величина — берём её и только её.
          DB="$(grep -m1 '^DATABASE_URL=' /srv/spotik/env | cut -d= -f2-)"
          [ -n "$DB" ] || { echo "::error::в /srv/spotik/env нет DATABASE_URL"; exit 1; }
          DATABASE_URL="$DB" node scripts/migrate.mjs
          REMOTE

      - name: Переключить, перезапустить и прибрать старые
        env:
          REL: ${{ steps.put.outputs.rel }}
        run: |
          ssh spotik "REL='$REL' bash -s" <<'REMOTE'
          set -euo pipefail
          prev="$(readlink -f /srv/spotik/current 2>/dev/null || echo -)"
          echo "было:  $prev"
          chown -R spotik:spotik "/srv/spotik/releases/$REL"
          # ⚠️ ПЕРЕКЛЮЧЕНИЕ АТОМАРНОЕ. `ln -sfn` на существующий
          # симлинк — это unlink + symlink, то есть кадр, в котором
          # `current` не существует. `mv -T` поверх готового
          # симлинка — один rename(2), и такого кадра нет.
          ln -sfn "/srv/spotik/releases/$REL" /srv/spotik/current.new
          mv -Tf /srv/spotik/current.new /srv/spotik/current
          echo "стало: $(readlink -f /srv/spotik/current)"

          # ⚠️ ПЕРЕЗАПУСК, А НЕ ПЕРЕЧИТЫВАНИЕ: подменить код на лету
          # у Next нечем, а WorkingDirectory службы указывает
          # на симлинк и берётся при старте.
          systemctl restart spotik

          # ⚠️ ЖДЁМ, ПОКА ПРИЛОЖЕНИЕ ОТВЕТИТ. Пока оно поднимается,
          # nginx честно отдаёт 502, и выкладка, доложившая успех
          # в эту секунду, соврала бы.
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || echo 000)"
            if [ "$code" = "200" ]; then ok=1; echo "  приложение отвечает 200 с попытки $i"; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::приложение не поднялось"
            systemctl status spotik --no-pager -l | tail -30
            journalctl -u spotik -n 60 --no-pager | tail -60
            exit 1
          fi

          # Прошлые версии храним, чтобы было куда откатиться:
          # текущая плюс четыре предыдущие.
          #
          # ⚠️ ЦЕПОЧКА СОБИРАЕТСЯ В ПЕРЕМЕННУЮ, А НЕ ГОНИТСЯ В `while`.
          # При `pipefail` grep, не нашедший НИ ОДНОЙ строки, роняет
          # весь конвейер — а «убирать нечего» это нормальное
          # состояние первых четырёх выкладок.
          cd /srv/spotik/releases
          keep="$(basename "$(readlink -f /srv/spotik/current)")"
          stale="$(ls -1dt */ 2>/dev/null | sed 's#/$##' \
            | grep -vx "$keep" | grep -vx placeholder | tail -n +5 || true)"
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale" | while read -r old; do echo "  убираю $old"; rm -rf -- "$old"; done
          else
            echo "  старых версий на удаление нет"
          fi
          echo "версии на сервере:"
          ls -1dt */ | sed 's#/$##; s/^/  /'
          REMOTE

      - name: Проверить живой сайт с раннера
        run: |
          # ⚠️ ПРОВЕРЯЕМ С РАННЕРА И ПО ИМЕНИ. Из среды разработки
          # сервер не виден, а раннер видит его ровно так же, как
          # человек в браузере, — вместе с DNS, TLS и редиректами.
          if ssh spotik 'test -d /etc/letsencrypt/live/spotik.shop'; then
            BASE=https://spotik.shop; TLS=1
          else
            BASE=http://spotik.shop;  TLS=0
            echo "::warning::сертификата ещё нет — проверяем по http. Прогоните «Первичная настройка сервера», когда разойдётся DNS"
          fi
          echo "проверяем $BASE"
          fail=0
          chk() { # chk «что» «ожидали» «получили»
            if [ "$2" = "$3" ]; then echo "  ✓ $1: $3"
            else echo "  ✗ $1: ждали $2, получили $3"; fail=1; fi
          }

          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$BASE/" || echo 000)
          chk "главная отдаёт 200" 200 "$code"

          # Метка доказывает, что живёт ИМЕННО эта сборка: двести
          # отдала бы и прошлая, не переключись симлинк.
          got=$(curl -fsS --max-time 20 "$BASE/_build.txt" 2>/dev/null | tr -d '\r\n' || echo нет)
          chk "на сайте эта сборка" "$GITHUB_SHA" "$got"

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/fonts/inter-cyrillic.woff2" || echo 000)
          chk "шрифт отдаётся с диска" 200 "$code"

          asset=$(grep -o '/_next/static/[A-Za-z0-9._/-]*\.js' /tmp/home.html | head -1)
          [ -n "$asset" ] || { echo "  ✗ в разметке нет ни одного скрипта из _next/static"; fail=1; }
          if [ -n "$asset" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$asset" || echo 000)
            chk "ассет $asset" 200 "$code"
            cc=$(curl -sSI --max-time 20 "$BASE$asset" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
            case "$cc" in *immutable*) echo "  ✓ долгий кэш у ассета: $cc";; *) echo "  ✗ у ассета кэш «$cc», ждали immutable"; fail=1;; esac
          fi

          cc=$(curl -sSI --max-time 20 "$BASE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
          case "$cc" in *no-cache*|*no-store*) echo "  ✓ HTML без долгого кэша: $cc";; *) echo "  ✗ у HTML кэш «$cc»"; fail=1;; esac

          if [ "$TLS" = 1 ]; then
            # ⚠️ HSTS ПРОВЕРЯЕТСЯ И НА ЗНАЧЕНИЕ, А НЕ ТОЛЬКО НА НАЛИЧИЕ.
            # Срок сейчас суточный намеренно; includeSubDomains
            # и preload не ставим — и то, и другое необратимо надолго.
            hs=$(curl -sSI --max-time 20 "$BASE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="strict-transport-security"{print $2}')
            case "$hs" in
              *includeSubDomains*|*preload*) echo "  ✗ в HSTS есть includeSubDomains или preload: «$hs»"; fail=1;;
              max-age=*) echo "  ✓ HSTS: $hs";;
              *) echo "  ✗ HSTS не пришёл: «$hs»"; fail=1;;
            esac
          fi

          plain=$(curl -sS -o /dev/null -w '%{size_download}' --max-time 20 "$BASE/")
          gz=$(curl -sS -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download}' --max-time 20 "$BASE/")
          if [ "$gz" -lt "$plain" ]; then echo "  ✓ gzip работает: $gz из $plain байт"
          else echo "  ✗ gzip не сжал: $gz против $plain"; fail=1; fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/чего-тут-нет/" || echo 000)
          chk "несуществующий путь отдаёт 404" 404 "$code"

          # ⚠️ ЖИВЫМ ЗАПРОСОМ ПРОВЕРЯЕТСЯ И ПРИЛОЖЕНИЕ, А НЕ ТОЛЬКО
          # ЛЕНДИНГ. «Главная отдаёт 200» ничего не говорит про
          # кабинет: он мог не подняться из-за базы, ключа или
          # миграции, а главная статическая и живёт из кэша.
          # ⚠️ `/fonts/` В ЭТОМ СПИСКЕ НЕ СЛУЧАЙНО. Там живёт
          # СТРАНИЦА — служебная витрина отбора гарнитур, — и рядом
          # лежит каталог с самими файлами шрифтов. Префиксная
          # локация nginx однажды забрала страницу себе и ответила
          # отказом вместо неё.
          for p in /cabinet/ /checkout/ /certificate/ /oferta/ /admin/login/ /fonts/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p" || echo 000)
            chk "страница $p" 200 "$code"
          done

          # ⚠️ СТАРЫЙ АДРЕС ПОЛИТИКИ ОБЯЗАН ВЕСТИ НА ОФЕРТУ. Ссылки
          # на него уже могли уехать наружу, а страницы по нему
          # больше нет: без перенаправления это был бы 404 у людей,
          # которые открывают документ по старой ссылке.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/privacy/" || echo 000)
          chk "старый адрес политики перенаправляет" 308 "$code"
          kuda=$(curl -sSI --max-time 20 "$BASE/privacy/" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          case "$kuda" in *"/oferta"*) echo "  ✓ ведёт на $kuda" ;; *) echo "  ✗ ведёт на ${kuda:-никуда}"; fail=1 ;; esac

          # ResultURL обязан СУЩЕСТВОВАТЬ и обязан ОТКАЗЫВАТЬ без
          # подписи. Двести здесь было бы хуже пятисотого: значит
          # «оплачено» ставится кем угодно.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$BASE/api/pay/result/" || echo 000)
          chk "уведомление без подписи отвергнуто" 400 "$code"

          # ⚠️ ИМИТАТОРА ОПЛАТЫ НА БОЕВОМ СЕРВЕРЕ НЕТ ВОВСЕ, и это
          # проверяется С РАННЕРА, по живому адресу, а не по нашему
          # представлению о том, что лежит в /srv/spotik/env. Обе
          # двери имитатора обязаны отвечать «такого нет»: пока
          # Робокасса не подключена, подтвердить оплату нечем.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$BASE/api/pay/fake/" || echo 000)
          chk "дверь имитатора закрыта" 404 "$code"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/pay/test/" || echo 000)
          chk "страницы тестовой оплаты нет" 404 "$code"

          if [ "$TLS" = 1 ]; then
            loc=$(curl -sSI --max-time 20 http://spotik.shop/ | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
            chk "http ведёт на https" "https://spotik.shop/" "$loc"
            loc=$(curl -sSI --max-time 20 https://www.spotik.shop/ | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
            chk "www ведёт на без-www" "https://spotik.shop/" "$loc"
            # Путь в редиректе должен сохраняться, иначе любая ссылка
            # с www приводила бы на главную вместо своей страницы.
            loc=$(curl -sSI --max-time 20 https://www.spotik.shop/fonts/ | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
            chk "редирект сохраняет путь" "https://spotik.shop/fonts/" "$loc"
            echo "  сертификат: $(curl -sS -o /dev/null -w '%{ssl_verify_result}' --max-time 20 https://spotik.shop/ | sed 's/^0$/проверен/')"
          fi

          [ "$fail" = 0 ] || { echo "::error::живой сайт не прошёл проверку"; exit 1; }
          echo "::notice::$BASE выложен и проверен"
