name: Публикация на GitHub Pages

on:
  push:
    # Ветка по умолчанию, как бы она ни называлась: репозиторий пока
    # живёт на рабочей ветке, main появится позже.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false, а не true: отменять уже идущую публикацию значит с заметной
  # вероятностью оставить Pages с наполовину выложенной выдачей
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Сборка статического экспорта
        run: npm run build
        env:
          NODE_ENV: production

      # Без этого файла Pages отдаёт выдачу через Jekyll и выбрасывает
      # всё, что начинается с подчёркивания, — то есть весь каталог _next
      # с бандлами и шрифтами.
      - name: Положить .nojekyll
        run: touch out/.nojekyll

      - name: Проверить, что ассеты на месте
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/fonts/golos-cyrillic.woff2
          test -d out/_next/static
          grep -q '/spotik-shop/_next/static' out/index.html
          grep -q "/spotik-shop/fonts/golos-cyrillic.woff2" out/index.html
          echo "выдача собрана, basePath проставлен"

      # Открывает собранную выдачу по боевому пути /spotik-shop/ в настоящем
      # браузере: 404 на ассетах, ошибки JS, незагруженные шрифты и
      # горизонтальный скролл ловятся только так. Проверка с корня такую
      # поломку не воспроизводит.
      - name: Открыть выдачу в браузере по боевому пути
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-export.mjs

      # Законы проекта про вордмарк: коэффициенты морфа в допуске ±1 %
      # и свес круглых литер не срезан. Оба проверяются по растру живой
      # страницы — регрессию в запечённых контурах иначе не поймать.
      - name: Проверить вордмарк по растру
        run: |
          node scripts/verify-morph.mjs
          node scripts/verify-clip.mjs
          node scripts/verify-enter.mjs
          node scripts/verify-follow.mjs
          node scripts/verify-footer.mjs
          node scripts/verify-footer-flow.mjs
          node scripts/verify-gutter.mjs
          node scripts/verify-coldstart.mjs

      # Закон проекта: three.js не попадает в бандл первого экрана.
      # Сторож у этого закона один, и он должен стоять в CI, а не в голове.
      - name: Проверить, что three.js не в первом экране
        run: node scripts/check-bundle.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
